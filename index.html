en", "With the syringe supplied, filled to the dose the child had for a previous medicine"], "e": "Kitchen spoons vary in size. Always use the device provided."}, {"id": "kid05", "t": "Babies & children", "q": "A parent asks whether to give paracetamol and ibuprofen at the same time for their child's fever. What is the advice?", "o": ["Use one; only consider switching to the other if the first doesn't help, and check with the pharmacist", "Give both together at every dose, as this brings a high fever down much faster", "Give both together, but at half the usual dose of each, and check with the pharmacist", "Use one, and if the fever isn't gone within an hour, give a double dose of it"], "e": "Giving both together isn't routinely recommended. Focus on the child's comfort and fluids, and watch for warning signs."}, {"id": "kid06", "t": "Babies & children", "q": "A child has chickenpox. Which of these should be avoided?", "o": ["Ibuprofen, as it can increase the risk of serious skin infection", "Paracetamol, as it can make the spots spread further", "Calamine lotion, as it can dry the skin and cause scarring", "Cooling gel, as it can block the spots and cause infection"], "e": "Use paracetamol for fever or pain, along with cooling products and fluids."}, {"id": "kid07", "t": "Babies & children", "q": "A pregnant customer has been in contact with a child with chickenpox and has never had it. What do you do?", "o": ["Advise her to contact her GP or midwife promptly", "Advise her to wait and contact her GP if a rash appears", "Reassure her; it's only a risk if the child lives with her", "Sell calamine to keep in case, and tell the pharmacist"], "e": "Chickenpox in pregnancy can be serious. Early assessment allows treatment if needed."}, {"id": "kid08", "k": 1, "t": "Babies & children", "q": "Which of these is a sign of dehydration in a baby?", "o": ["Fewer wet nappies, a sunken soft spot on the head, and drowsiness", "More wet nappies than usual, and wanting to feed more often", "A bulging soft spot on the head, and crying with lots of tears", "Dribbling more than usual, red cheeks, and chewing on hands"], "e": "Dehydrated babies need urgent medical help."}, {"id": "kid09", "t": "Babies & children", "q": "How is wet combing used to treat head lice?", "o": ["Comb wet, conditioned hair with a detection comb every few days for about 2 weeks", "Comb dry hair with a detection comb once, and repeat only if lice are seen", "Comb wet, conditioned hair with a normal hairbrush every day for a week", "Comb wet, conditioned hair with a detection comb once only, as that removes all the eggs"], "e": "Repeated combing removes lice as eggs hatch. It's an option for anyone, including babies and pregnant women."}, {"id": "kid10", "k": 1, "t": "Babies & children", "q": "A child with a barking cough is now making a harsh noise when breathing in, even at rest, and is struggling. What do you do?", "o": ["Treat it as an emergency: call 999", "Suggest steam from a hot shower", "Book them an urgent GP slot for tomorrow", "Sit them up and wait until morning"], "e": "Noisy breathing at rest or difficulty breathing in croup is an emergency."}, {"id": "kid11", "t": "Babies & children", "q": "A parent says their teething baby has a high fever. What is correct?", "o": ["Teething doesn't usually cause a high fever, so the baby should be assessed for another cause", "High fever is common with teething, so sell teething gel and infant paracetamol", "Teething often causes a high fever, so refer only if it lasts more than a week", "Teething fevers are normal, so sell a teething gel and let the pharmacist know afterwards"], "e": "Don't put a high temperature down to teething without other causes being ruled out."}, {"id": "kid12", "t": "Babies & children", "q": "A child has hand, foot and mouth disease. What is the usual advice?", "o": ["Fluids and children's paracetamol or ibuprofen if needed; it usually clears up within 7–10 days", "Antibiotics from the GP, as it's a bacterial infection that spreads quickly", "Keep them off school for 3 weeks, and use hydrocortisone cream on the blisters", "Fluids and children's paracetamol, plus a GP visit for antibiotics if it lasts more than 3 days"], "e": "Refer if the child stops drinking, shows signs of dehydration, or is very unwell."}, {"id": "kid13", "t": "Babies & children", "q": "Why shouldn't honey be given to babies under 1 year old?", "o": ["Risk of infant botulism", "Risk of infant colic", "Risk of a bee sting allergy", "Risk of infant eczema flares"], "e": "Honey can be a soothing cough remedy for children over 1."}, {"id": "kid14", "t": "Babies & children", "q": "Why are sugar-free medicines preferred for children?", "o": ["They are better for teeth, especially with regular use", "They work faster, as sugar slows down how they're absorbed", "They contain no sweeteners at all, so suit all children", "They're less likely to cause allergies, especially in babies"], "e": "Sugar-free versions help protect children's teeth."}, {"id": "kid15", "u": 1, "t": "Babies & children", "q": "A 4-year-old has earache and a fever and keeps pulling at their ear. What do you do?", "o": ["Pass to the pharmacist, who can assess earache in ages 1 to 17 under Pharmacy First", "Sell olive oil ear drops and children's paracetamol, then refer to the GP if still bad in 2 weeks", "Refer to the GP instead, as Pharmacy First earache is for adults only", "Sell children's ibuprofen and suggest gently cleaning with a cotton bud"], "e": "Children's paracetamol or ibuprofen helps the pain. Most ear infections get better without antibiotics."}, {"id": "kid16", "t": "Babies & children", "q": "What is the sun advice for babies under 6 months?", "o": ["Keep them out of direct sunlight", "Short spells of direct sun are fine", "Use sunscreen all over, then sun is fine", "Direct sun is fine before 11am"], "e": "Use shade, clothing and hats. Use sunscreen on small exposed areas of skin."}, {"id": "kid17", "t": "Babies & children", "q": "What is the vitamin D advice for children aged 1 to 4?", "o": ["A daily supplement of 10 micrograms", "A weekly supplement of 10 micrograms", "A daily supplement, but only in winter", "None needed if they play outside daily"], "e": "Breastfed babies are advised to have 8.5–10 micrograms from birth. Babies having 500ml+ of formula a day don't need a supplement."}, {"id": "kid18", "t": "Babies & children", "q": "A parent wants threadworm treatment for their 18-month-old. What do you do?", "o": ["Refer to the pharmacist, as OTC mebendazole is only for ages 2 and over", "Sell it, as one dose is safe from 12 months for threadworm", "Sell it for the whole family, but give the baby half a tablet", "Sell the suspension, as the liquid form is licensed from 12 months, and check the dose"], "e": "Under-2s need medical advice. Hygiene measures still apply to the whole household."}, {"id": "kid19", "t": "Babies & children", "q": "What is the advice for cradle cap (crusty patches on a baby's scalp)?", "o": ["It's usually harmless; soften with baby oil or emollient and gently brush", "It's a fungal infection, so use antifungal cream twice a day", "It's usually harmless; pick the crusts off gently after bath time", "It's caused by poor hygiene, so wash the scalp twice daily with adult shampoo"], "e": "Refer if it spreads, looks infected or is itchy."}, {"id": "kid20", "t": "Babies & children", "q": "A parent wants a decongestant nasal spray for their 4-year-old. What do you do?", "o": ["Explain decongestant sprays aren't suitable under 6; suggest saline drops", "Sell a children's decongestant spray, but for no more than 7 days", "Sell the adult spray, using one spray a night instead of two", "Explain sprays aren't for under 6s, and sell a decongestant tablet instead"], "e": "Saline drops or sprays are safe for young children. Refer if breathing is difficult."}, {"id": "life01", "t": "Healthy living", "q": "A pregnant customer wants nicotine patches to stop smoking. What is correct?", "o": ["NRT can be used in pregnancy; involve the pharmacist and signpost to the stop smoking service", "NRT can't be used in pregnancy; signpost her to the stop smoking service instead", "NRT is fine in pregnancy, so sell the strongest patch without involving the pharmacist", "She should cut down slowly instead, as nicotine in any form harms the baby more than smoking"], "e": "NRT is much safer than smoking. The pharmacist will advise on the best form."}, {"id": "life02", "t": "Healthy living", "q": "A 14-year-old asks for Nytol (diphenhydramine) because they can't sleep before exams. What do you do?", "o": ["Explain it isn't suitable under 16, give sleep advice, and involve the pharmacist", "Sell a small pack for a few nights only, as exam stress is short-term", "Sell it if a parent agrees by phone, and let the pharmacist know afterwards", "Suggest a drowsy hay fever tablet instead, as it isn't classed as a sleep aid"], "e": "OTC sleep aids are for adults (16+, check the pack) and for short-term use only."}, {"id": "life03", "t": "Healthy living", "q": "What warning goes with OTC sleep aids?", "o": ["Short-term use only; may cause next-day drowsiness, so be careful driving", "Safe to take every night long-term, as OTC sleep aids aren't habit-forming at all", "Best taken with a small alcoholic drink, as it helps the tablet work faster", "Double the dose on the second night if the first dose doesn't work"], "e": "Refer ongoing sleep problems. Sleep hygiene advice comes first."}, {"id": "life04", "t": "Healthy living", "q": "Who can buy orlistat (alli) for weight loss?", "o": ["Adults 18+ with a BMI of 28 or more, after the pharmacist checks", "Anyone 16+ wanting to lose weight, after the pharmacist checks", "Adults 18+ with any BMI, as long as they follow a low-fat diet", "Adults 18+ with a BMI of 40 or more, but only with a letter from their GP"], "e": "Orlistat goes with a reduced-fat diet. Fatty meals cause unpleasant side effects."}, {"id": "life05", "t": "Healthy living", "q": "A customer on the contraceptive pill is buying orlistat. What should the pharmacist make sure she knows?", "o": ["Severe diarrhoea can stop the pill working, so extra contraception may be needed", "There are no issues, as orlistat stays in the gut and isn't absorbed", "She must stop the pill while taking orlistat and use condoms until the course finishes", "She should take the pill and orlistat together with her main meal each day"], "e": "Always check other medicines when selling orlistat."}, {"id": "life06", "t": "Healthy living", "q": "Which way of using NRT works best for most people?", "o": ["A patch combined with a quick-acting product such as gum or spray", "A patch on its own, as using two products risks too much nicotine", "Gum on its own, chewed like normal gum whenever cravings get bad", "Cutting down on cigarettes first, then starting patches a month later"], "e": "Combining NRT products, plus support from a stop smoking service, gives the best chance of quitting."}, {"id": "life07", "t": "Healthy living", "q": "A customer had a heart attack two weeks ago and wants NRT. What do you do?", "o": ["Involve the pharmacist before choosing NRT", "Sell the weakest patch to be on the safe side", "Tell them NRT can't be used after a heart attack", "Sell gum, and let the pharmacist know afterwards"], "e": "NRT is still usually much safer than smoking, but the pharmacist should advise."}, {"id": "life08", "t": "Healthy living", "q": "A smoker asks whether vaping can help them quit. What is accurate?", "o": ["Vaping can help people quit and is far less harmful than smoking, but it isn't risk-free", "Vaping is just as harmful as smoking, so the NHS advises against using it to quit", "Vaping is completely risk-free, so it's fine to keep vaping long term without worry", "Vaping can't help people quit, as e-cigarettes contain more nicotine than cigarettes"], "e": "Signpost to the NHS stop smoking service. Vapes aren't for young people or non-smokers."}, {"id": "life09", "t": "Healthy living", "q": "Which insect repellent ingredient does the NHS recommend for malaria areas?", "o": ["DEET (around 50%)", "Citronella oil", "Garlic tablets", "Vitamin B1 tablets"], "e": "Bite prevention matters as well as antimalarials. The pharmacist advises on travel medicines."}, {"id": "life10", "t": "Healthy living", "q": "Someone is travelling abroad and asks what to pack for tummy upsets. What is a key item?", "o": ["Oral rehydration salts", "Indigestion tablets", "A laxative such as senna", "Antibiotic tablets"], "e": "Rehydration is the main treatment. Loperamide may be suitable for adults in some situations; check with the pharmacist."}, {"id": "life11", "t": "Healthy living", "q": "What is the UK vitamin D advice for adults in autumn and winter?", "o": ["Consider 10 micrograms daily", "Consider 10 micrograms weekly", "Consider 100 micrograms daily", "Not needed in the UK if eating well"], "e": "Some groups are advised to take it all year round."}, {"id": "life12", "t": "Healthy living", "q": "Which supplement should pregnant women avoid?", "o": ["Vitamin A (retinol) supplements, including fish liver oil", "Folic acid, as it's only needed once the baby has been born", "Vitamin D, as it can build up and harm the baby", "Pregnancy multivitamins, as they contain too much iron"], "e": "High doses of vitamin A can harm the unborn baby. Pregnancy-specific vitamins are formulated to be safe."}, {"id": "life13", "t": "Healthy living", "q": "A customer on antidepressants and the contraceptive pill wants St John's wort. What do you do?", "o": ["Don't sell it yourself; refer to the pharmacist", "Sell it, as herbal products don't interact", "Sell it, but stop the antidepressant first", "Sell it and let the pharmacist know afterwards"], "e": "St John's wort can stop the pill working and interacts with antidepressants and other medicines."}, {"id": "life14", "t": "Healthy living", "q": "What is the UK low-risk alcohol guideline?", "o": ["No more than 14 units a week, spread over 3 or more days", "No more than 21 units a week for men and 14 for women", "No more than 14 units a week, which can be saved up for the weekend", "No more than 14 units a day, with 2 alcohol-free days a week"], "e": "Signpost people who are worried about their drinking to support services."}, {"id": "life15", "u": 1, "t": "Healthy living", "q": "Which free NHS check can many community pharmacies offer adults aged 40 and over?", "o": ["A blood pressure check", "A bone density scan", "A routine eye test", "A chest X-ray check"], "e": "High blood pressure often has no symptoms. Pharmacy checks help find it early."}, {"id": "life16", "u": 1, "t": "Healthy living", "q": "A customer asks to buy a weight-loss injection (e.g. Wegovy or Mounjaro) over the counter. What is correct?", "o": ["They're prescription-only, so can't be sold OTC; unregulated sellers are dangerous", "They're P medicines, so can be sold if the pharmacist checks their BMI", "They can be sold OTC to adults with a BMI over 30, after a pharmacist check", "They can't be sold here, but buying them online from a cheaper website is fine"], "e": "The MHRA has warned about fake weight-loss injections sold online. Signpost to the GP or a regulated prescribing service."}, {"id": "life17", "t": "Healthy living", "q": "A customer asks for melatonin to help them sleep. What is correct in the UK?", "o": ["Melatonin is prescription-only in the UK, so it can't be sold OTC", "It's a pharmacy medicine, so it can be sold after the pharmacist checks", "It's a food supplement in the UK, so it can be sold from the shelf", "It can be sold OTC to adults over 55 for up to 3 weeks"], "e": "Offer sleep advice and involve the pharmacist."}, {"id": "life18", "k": 1, "t": "Healthy living", "q": "A distressed customer tells you they are having thoughts of ending their life. What do you do?", "o": ["Take it seriously, stay calm, get the pharmacist and make sure they get urgent help (999 if in immediate danger)", "Give them a Samaritans leaflet, and tell the pharmacist about it once they've left the shop", "Reassure them the feeling will pass, and suggest they book a routine GP appointment for next month", "Stay calm and gently change the subject so they don't get more upset, then tell the pharmacist later on"], "e": "Never ignore it. Getting immediate help can save a life. Samaritans are available 24/7 on 116 123."}, {"id": "life19", "t": "Healthy living", "q": "Why should customers tell the pharmacist about herbal remedies they take?", "o": ["Herbal products can interact with medicines and have side effects", "Herbal products are natural, so the pharmacist only needs them for the records", "So the pharmacist can check they're buying the strongest herbal brand", "Herbal remedies only matter if they're taken at the same time as medicines"], "e": "\"Natural\" doesn't mean safe. Include herbal products in your \"Medication\" question."}, {"id": "life20", "t": "Healthy living", "q": "What should a customer know about minoxidil for hair loss?", "o": ["It takes about 4 months to work, and hair loss returns if they stop", "It works within 2 weeks, and the new hair stays even after they stop", "It takes about 4 months to work, and the new hair stays once it's grown", "It works in a month, and hair loss returns if they stop"], "e": "OTC minoxidil is for adults 18–65. Refer sudden or patchy hair loss."}, {"id": "safe01", "t": "Safety & emergencies", "q": "A customer wants to return an unopened box of tablets bought yesterday. What happens to the medicine?", "o": ["It can't go back on the shelf and goes for safe disposal", "It can go back on the shelf, as the box hasn't been opened", "It goes back on the shelf once the pharmacist has checked the box", "It's sent back to the wholesaler to be resold to another pharmacy"], "e": "Once medicines leave the pharmacy, nobody can be sure how they've been stored."}, {"id": "safe02", "u": 1, "t": "Safety & emergencies", "q": "How many conditions does Pharmacy First in England cover?", "o": ["Seven", "Five", "Twelve", "Three"], "e": "Sinusitis, sore throat, earache, infected insect bites, impetigo, shingles and uncomplicated UTI in women."}, {"id": "safe03", "u": 1, "t": "Safety & emergencies", "q": "Which of these is NOT one of the seven Pharmacy First conditions?", "o": ["Hay fever", "Sore throat", "Impetigo", "Shingles"], "e": "Hay fever is managed with ordinary OTC advice and products."}, {"id": "safe04", "k": 1, "t": "Safety & emergencies", "q": "A customer's lips and tongue suddenly swell and they're struggling to breathe. What do you do?", "o": ["Call 999 and get the pharmacist immediately", "Give an antihistamine and see if it settles", "Get the pharmacist and wait to see if it settles", "Sit them outside and call their GP for advice"], "e": "If they have an adrenaline auto-injector, it should be used. Anaphylaxis is life-threatening."}, {"id": "safe05", "k": 1, "t": "Safety & emergencies", "q": "A customer's face is drooping on one side and their speech is slurred. What do you do?", "o": ["Call 999 immediately, as it may be a stroke", "Sit them down and see if it passes in an hour", "Ask the pharmacist to check their blood pressure", "Call their GP surgery for an urgent appointment"], "e": "FAST: Face, Arms, Speech, Time to call 999."}, {"id": "safe06", "t": "Safety & emergencies", "q": "A customer collapses in the shop. What is your first action?", "o": ["Call for help (the pharmacist and 999), and follow first-aid procedures", "Sit them up and give them a drink of water, then call the pharmacist", "Move them to the back room for privacy, then call for help", "Wait a few minutes to see if they come round before calling 999"], "e": "Know your pharmacy's emergency procedure and where the first aider is."}, {"id": "safe07", "t": "Safety & emergencies", "q": "A customer becomes angry and aggressive at the counter. What do you do?", "o": ["Stay calm, don't argue, and get the pharmacist or manager; follow your safety policy", "Sell them what they want so they leave, then tell the pharmacist afterwards", "Ask them firmly to leave and walk them out of the shop yourself", "Stay calm but argue your case firmly so they know you're following the rules"], "e": "Your safety comes first. Report incidents as your pharmacy requires."}, {"id": "safe08", "t": "Safety & emergencies", "q": "A customer tells you they had a side effect from a medicine they bought. What do you do?", "o": ["Tell the pharmacist, who can advise and report it via the Yellow Card scheme", "Offer a refund and suggest they try a different brand next time", "Tell them side effects are listed on the leaflet, so nothing needs doing", "Advise them to keep taking it and check with the pharmacist if it gets worse"], "e": "Anyone, including patients, can report suspected side effects via the Yellow Card scheme."}, {"id": "safe09", "t": "Safety & emergencies", "q": "At what temperature range should a medicines fridge be kept?", "o": ["2–8°C", "0–4°C", "4–10°C", "8–15°C"], "e": "Fridge temperatures are checked and recorded every day."}, {"id": "safe10", "t": "Safety & emergencies", "q": "You notice a used needle on the shop floor. What do you do?", "o": ["Don't pick it up with bare hands; follow the sharps procedure and use a sharps bin", "Pick it up carefully by the plastic end and put it in the general waste", "Cover it with a box and leave it for the cleaner to deal with at closing", "Wrap it in paper towel, pick it up and hand it to the pharmacist to check"], "e": "Needlestick injuries can spread infection. Report any injury straight away."}, {"id": "safe11", "t": "Safety & emergencies", "q": "A customer wants Nurofen Cold & Flu tablets as well as Nurofen tablets. What is the problem?", "o": ["Both contain ibuprofen, so together they could exceed the safe dose", "None, as Cold & Flu contains paracetamol, not ibuprofen, so they're fine", "They're fine together if taken at least an hour apart", "The decongestant in Cold & Flu stops the ibuprofen from working"], "e": "Always check active ingredients across everything a customer is buying or already taking."}, {"id": "safe12", "t": "Safety & emergencies", "q": "A parent wants to give an adult medicine to their child at a smaller dose. What do you do?", "o": ["Refer to the pharmacist; don't advise using a medicine outside its licensed age or use", "Advise halving the adult dose, as children need about half as much", "Check the child's weight and work out a smaller dose from the adult one", "Say it's fine as long as they use the measuring spoon from the pack"], "e": "Children's doses aren't simply a fraction of adult doses."}, {"id": "safe13", "t": "Safety & emergencies", "q": "A 12-year-old has been sent alone to buy paracetamol for their mum. What do you do?", "o": ["Involve the pharmacist and follow your pharmacy's SOP", "Sell it, as the legal minimum age for paracetamol is 12", "Sell a small pack, as it's for an adult and not for the child", "Sell it if they have a note from mum, then tell the pharmacist"], "e": "There is no single age limit in law, but your SOP and the pharmacist decide."}, {"id": "safe14", "t": "Safety & emergencies", "q": "A customer asks for \"Sudafed\". Why should you ask more questions?", "o": ["Different Sudafed products contain different ingredients", "Sudafed is pharmacy-only, so the pharmacist must hand it over", "All Sudafed products have the same decongestant, so just check the age", "You need to check their ID, as Sudafed can only be sold to over-18s"], "e": "Brand ranges include tablets with different ingredients, and nasal sprays. Ask WWHAM questions and check suitability."}, {"id": "safe15", "k": 1, "t": "Safety & emergencies", "q": "A customer on lithium wants ibuprofen. What do you do?", "o": ["Refer to the pharmacist; NSAIDs can raise lithium to toxic levels", "Sell it for 3 days only, as short courses don't affect lithium", "Sell it, but tell them to check their lithium levels next month", "Sell it and let the pharmacist know afterwards so they can note it"], "e": "Lithium has a narrow safe range. NSAIDs are usually avoided."}, {"id": "safe16", "k": 1, "t": "Safety & emergencies", "q": "A customer who takes weekly methotrexate wants aspirin or ibuprofen. What do you do?", "o": ["Refer to the pharmacist; NSAIDs can increase methotrexate toxicity", "Sell aspirin, as only ibuprofen interacts with methotrexate", "Sell it, as weekly methotrexate is too low a dose to interact", "Sell it, but tell them to skip that week's methotrexate dose"], "e": "Methotrexate interacts with several medicines. Always ask about regular medicines."}, {"id": "safe17", "t": "Safety & emergencies", "q": "A customer with kidney disease wants ibuprofen for joint pain. What do you do?", "o": ["Refer to the pharmacist; NSAIDs can make kidney problems worse", "Sell it, but advise drinking plenty of water to protect the kidneys", "Sell the lowest strength, as 200mg tablets are kind to the kidneys", "Sell it and suggest they check with their kidney doctor at their next visit"], "e": "Also refer people with heart failure or who take some blood pressure medicines."}, {"id": "safe18", "t": "Safety & emergencies", "q": "A customer who is allergic to aspirin wants ibuprofen. What do you do?", "o": ["Refer to the pharmacist; people allergic to aspirin can react to other NSAIDs too", "Sell it, as ibuprofen is a completely different medicine from aspirin", "Suggest naproxen instead, as it's further from aspirin than ibuprofen", "Sell it, and tell the pharmacist afterwards so they can add it to their record"], "e": "Cross-sensitivity between NSAIDs is common."}, {"id": "safe19", "t": "Safety & emergencies", "q": "A customer has run out of their regular prescription medicine and can't reach their GP. What do you do?", "o": ["Ask the pharmacist, who may be able to make an emergency supply", "Tell them it's fine to go without until the GP surgery reopens", "Sell them the medicine, as it's already been prescribed for them", "Suggest they borrow a few tablets from a family member on the same medicine"], "e": "Pharmacists can sometimes supply an urgent repeat medicine under the rules. Not all medicines are eligible."}, {"id": "safe20", "t": "Safety & emergencies", "q": "A customer is buying several different products for the same symptoms. What should you check?", "o": ["The active ingredients, to avoid doubling up", "The brands, as different brands never share ingredients", "The prices, so you can suggest the cheapest option", "That they're all GSL, as these are safe together"], "e": "Paracetamol, ibuprofen and antihistamines often turn up in more than one product."}]};const LOGO="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAFKAtADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD72ooPSvl7S/jXep+0L408E6147/sPU7LVXj0+HUY0ksZLfA8tGU7WU453K4znnPFdOGwssQ2ovZXMqtVUkm0fUNFcGnjfxPpkanX/AAab6LGRd+H7pLhWHr5UhRx9FL/U1Yi+LfgEuI7/AFaXR5e8er2k1mR+MihfyNN4Kt0jf01/IlYmk9Oa3rodpRWTZ+K/CupKDpviXR7vPTyL2N/5NWqro4yjqw9VOa55QlHRqxspJ7C0Uu1vQ0bW/un8qkYlFLtb+6fyo2t/dP5UAJRS7W/un8qMHPSgBeNpxTadjjkZNJg+hoAM8YpKMH0ooAKKKKACiiigAoopR1oASilY80lABRRRQAoxnmk70UUAFFGeMUUAFHQ0UUAFFFGD6UAFFLtb+6fyo2t/dP5UAJRS4PoaNr <script>
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
let BANK=[],META={},TOPICS=[],byTopic={};
let cur=null; // {code,title,qs}
let order=[],i=0,score=0,answers=[];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* seeded randomness so every test is the same for everyone */
function hash(str){let h=1779033703^str.length;for(let k=0;k<str.length;k++){h=Math.imul(h^str.charCodeAt(k),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;};}
function rng(seed){let a=hash(seed)();return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r=Math.random){const a=[...arr];for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}

/* slot s = day*5 + test (0..99). Each topic walks through its own reshuffled list, so every question is used evenly and no question repeats within a day */
function pickFromTopic(topic,s){const list=byTopic[topic],n=list.length,r=Math.floor(s/n);return shuffle(list,rng(`c${META.cycle}|${topic}|${r}`))[s%n];}
function buildTest(day,t){
  const s=day*5+t;
  const qs=shuffle(TOPICS.map(tp=>pickFromTopic(tp,s)),rng(`c${META.cycle}|order|${s}`)).slice(0,10);
  const w=Math.floor(day/5)+1,d=DAYS[day%5];
  return{code:`C${META.cycle}-W${w}-${d}-T${t+1}`,title:`Week ${w}, ${d}, Test ${t+1}`,qs};
}

/* per-viewer progress (this browser only) */
const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const resKey=()=>`ccq-results-c${META.cycle}`,MKEY='ccq-mistakes';

function dateFor(day){const d=new Date(META.cycleStart+'T12:00:00');d.setDate(d.getDate()+Math.floor(day/5)*7+day%5);return d;}
function todayIndex(){
  const start=new Date(META.cycleStart+'T00:00:00'),now=new Date();
  const diff=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-start)/864e5);
  if(diff<0)return{state:'before'};
  const w=Math.floor(diff/7),wd=diff%7;
  if(w>3)return{state:'after'};
  if(wd>4)return{state:'weekend',week:w};
  return{state:'on',week:w,day:w*5+wd};
}
function band(pct,critMissed){
  if(pct>=80&&critMissed===0)return{k:'comp',label:'Competent',text:'Safe to handle these situations on the counter, following SOPs and referring to the pharmacist when needed.'};
  if(pct>=60)return{k:'part',label:'Partly competent',text:critMissed&&pct>=80?'Good score, but a safety-critical question was missed. Go over it with the pharmacist.':'Some gaps. Go over the missed questions with the pharmacist.'};
  return{k:'not',label:'Not yet competent',text:'Further training needed on these topics. Review the explanations with the pharmacist before the next test.'};
}

let viewWeek=0;
const gear=document.getElementById('gear');
gear.addEventListener('click',()=>{if(gear.getAttribute('aria-current'))home();else settings();window.scrollTo({top:0});});
function codeFor(day,t){return`C${META.cycle}-W${Math.floor(day/5)+1}-${DAYS[day%5]}-T${t+1}`;}
function nextTest(){
  const ti=todayIndex(),res=store.get(resKey(),{});
  const firstUndone=(from,to)=>{for(let day=from;day<=to;day++)for(let t=0;t<5;t++)if(!res[codeFor(day,t)])return{day,t};return null;};
  if(ti.state==='on')return{pick:firstUndone(ti.day,ti.day),todayDone:!firstUndone(ti.day,ti.day),catch:firstUndone(0,ti.day-1)};
  if(ti.state==='weekend')return{pick:firstUndone(ti.week*5,ti.week*5+4)||firstUndone(0,19)};
  return{pick:firstUndone(0,19)};
}
function home(){
  gear.removeAttribute('aria-current');
  document.getElementById('progwrap').hidden=true;document.getElementById('metarow').hidden=true;
  const n=nextTest(),mist=store.get(MKEY,[]).filter(id=>BANK.some(q=>q.id===id));
  let body;
  if(n.pick){
    const T=buildTest(n.pick.day,n.pick.t);
    body=`<p class="big">Ready for your next test?</p><p class="note" style="font-size:1rem">${T.title} · 10 questions</p><button class="btn start" id="go">Start test</button>`;
    app.innerHTML=`<section class="card hero">${body}</section>`;
    document.getElementById('go').addEventListener('click',()=>begin(T));
  }else{
    body=`<p class="big">${n.todayDone?'All of today’s tests are done. Well done.':'Every test in this cycle is done.'}</p><p class="note" style="font-size:1rem">${mist.length?'You can practise the questions you got wrong.':'Come back tomorrow for the next tests.'}</p>${mist.length?'<button class="btn start" id="go">Practise my mistakes</button>':''}`;
    app.innerHTML=`<section class="card hero">${body}</section>`;
    if(mist.length)document.getElementById('go').addEventListener('click',()=>begin({code:'PRACTICE-MISTAKES',title:'My mistakes',qs:shuffle(mist).slice(0,10).map(id=>BANK.find(q=>q.id===id))}));
  }
  const newQs=BANK.filter(q=>q.u);
  if(newQs.length){
    app.insertAdjacentHTML('beforeend',`<section class="card rules"><div><span class="new">New &amp; updated rules</span></div><p class="big2">Keep up with the latest changes</p><p class="note">${newQs.length} questions on recent changes, such as Pharmacy First, withdrawn medicines and new pharmacy-only products.</p><button class="btn ghost" id="rulesgo">Practise new rules</button></section>`);
    document.getElementById('rulesgo').addEventListener('click',()=>begin({code:'PRACTICE-NEW',title:'New & updated rules',qs:shuffle(newQs).slice(0,10)}));
  }
}
function settings(){
  gear.setAttribute('aria-current','page');
  document.getElementById('progwrap').hidden=true;document.getElementById('metarow').hidden=true;
  const ti=todayIndex(),res=store.get(resKey(),{}),mist=store.get(MKEY,[]).filter(id=>BANK.some(q=>q.id===id));
  const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const status=ti.state==='before'?`This cycle starts on ${fmt(dateFor(0))}. You can try any test now.`:ti.state==='after'?'This 4-week cycle has finished. Ask Claude to refresh the question bank for the next cycle.':ti.state==='weekend'?'It’s the weekend. Catch up on any tests you missed this week.':`Today is ${['Monday','Tuesday','Wednesday','Thursday','Friday'][ti.day%5]} of week ${ti.week+1}. Today’s tests are highlighted.`;
  const done=Object.keys(res).length;
  let grid=`<div class="h"></div>${[1,2,3,4,5].map(n=>`<div class="h">Test ${n}</div>`).join('')}`;
  for(let d=0;d<5;d++){
    const day=viewWeek*5+d,isToday=ti.state==='on'&&ti.day===day;
    grid+=`<div class="day${isToday?' today':''}">${DAYS[d]}<small>${fmt(dateFor(day))}</small></div>`;
    for(let t=0;t<5;t++){
      const code=`C${META.cycle}-W${viewWeek+1}-${DAYS[d]}-T${t+1}`,r=res[code];
      const cls=r?`done ${r.band}`:isToday?'today':'';
      grid+=`<button class="slot ${cls}" id="slot-${day}-${t}" data-day="${day}" data-t="${t}" aria-label="${DAYS[d]} test ${t+1}${r?`, scored ${r.score} out of ${r.total}`:''}">${r?`${r.score}/${r.total}`:t+1}</button>`;
    }
  }
  const newQs=BANK.filter(q=>q.u);
  app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><h2 style="font-size:1.4rem">Settings &amp; information</h2><button class="btn ghost" id="back">Back to test</button></div>
  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2>Cycle ${META.cycle} timetable</h2><span class="note">${done}/100 tests done</span></div>
    <p style="margin:0">${status}</p>
    <div class="weeks" role="group" aria-label="Choose week">${[0,1,2,3].map(w=>`<button class="wk" id="wk-${w}" data-w="${w}" aria-pressed="${w===viewWeek}">Week ${w+1}</button>`).join('')}</div>
    <div class="grid">${grid}</div>
    <div class="legend"><span class="comp"><i></i>Competent</span><span class="part"><i></i>Partly competent</span><span class="not"><i></i>Not yet competent</span></div>
    <p class="note">Every test is 10 questions, one from each topic. Each test is the same for everyone, so results can be compared. Scores are saved in this browser only.</p>
  </section>
  <section class="card">
    <h2>Extra practice</h2>
    <div class="practice">
      <button class="btn ghost" id="pm" ${mist.length?'':'disabled'}>My mistakes (${mist.length})</button>
    </div>
    <p class="note">“My mistakes” builds a test from questions you got wrong in this browser. A question drops off the list once you get it right.</p>
  </section>
  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2>What’s in this cycle</h2><span class="note">Updated ${new Date(META.updated+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span></div>
    <ul class="changes">${(META.changes||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    <p class="note">${BANK.length} questions across ${TOPICS.length} topics. ${BANK.filter(q=>q.k).length} are marked safety-critical. Next refresh due by ${new Date(META.refreshDue+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}.</p>
  </section>
  <section class="card">
    <h2>Pass marks</h2>
    <div class="thresh">
      <div class="tb comp"><span>Competent</span><span>8–10 correct and every safety-critical question right</span></div>
      <div class="tb part"><span>Partly competent</span><span>6–7 correct, or 8+ with a safety-critical question missed</span></div>
      <div class="tb not"><span>Not yet competent</span><span>5 or fewer correct</span></div>
    </div>
    <p class="note">Safety-critical questions cover situations where a wrong answer could harm a customer, such as serious interactions, red flags and emergencies.</p>
  </section>
  <section class="card">
    <h2>How it works</h2>
    <ul class="changes">
      <li>Press <strong>Start test</strong> to get the next test due today. Answer all 10 questions; results and explanations come at the end.</li>
      <li>There are 5 tests each working day for 4 weeks. Each test has one question from each topic and is the same for everyone.</li>
      <li>Scores are saved in this browser only. Download the result sheet at the end of a test to keep a record.</li>
      <li>The question bank is refreshed every 4 weeks, with new questions on medicine and legal changes.</li>
      <li>Based on UK practice. If you’re unsure on the counter, ask your pharmacist. Your local SOPs come first.</li>
    </ul>
  </section>`;
  document.getElementById('back').addEventListener('click',()=>{home();window.scrollTo({top:0});});
  app.querySelectorAll('.wk').forEach(b=>b.addEventListener('click',()=>{viewWeek=+b.dataset.w;store.set('ccq-week',viewWeek);settings();}));
  app.querySelectorAll('.slot').forEach(b=>b.addEventListener('click',()=>begin(buildTest(+b.dataset.day,+b.dataset.t))));
  document.getElementById('pm').addEventListener('click',()=>{const ids=shuffle(mist).slice(0,10);begin({code:'PRACTICE-MISTAKES',title:'My mistakes',qs:ids.map(id=>BANK.find(q=>q.id===id))});});
}

function begin(test){
  cur=test;i=0;score=0;answers=[];
  order=test.qs.map(q=>({...q,opts:shuffle(q.o.map((t,n)=>({t,ok:n===0})))}));
  document.getElementById('progwrap').hidden=false;document.getElementById('metarow').hidden=false;
  render();window.scrollTo({top:0});
}
function render(){
  const q=order[i];
  document.getElementById('prog').style.width=(i/order.length*100)+'%';
  document.getElementById('pos').textContent=`Question ${i+1} of ${order.length}`;
  document.getElementById('run').textContent=`Score ${score}/${i}`;
  document.getElementById('run').textContent='';
  const last=i===order.length-1;
  app.innerHTML=`<section class="card"><p class="q">${esc(q.q)}</p><div class="opts" role="radiogroup" aria-label="Answer options">${q.opts.map((o,n)=>`<button class="opt" id="opt-${n}" data-n="${n}" role="radio" aria-checked="false"><b>${'ABCD'[n]}</b><span>${esc(o.t)}</span></button>`).join('')}</div><div class="row" style="justify-content:space-between;align-items:center"><button class="linkbtn" id="quit">Quit test</button><button class="btn" id="next" disabled>${last?'Finish and see results':'Next question'}</button></div></section>`;
  let chosen=null;const nx=document.getElementById('next');
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{chosen=+b.dataset.n;app.querySelectorAll('.opt').forEach(x=>{const on=x===b;x.classList.toggle('sel',on);x.setAttribute('aria-checked',on);});nx.disabled=false;}));
  nx.addEventListener('click',()=>{if(chosen===null)return;pick(chosen);if(last)results();else{i++;render();window.scrollTo({top:0});}});
  document.getElementById('quit').addEventListener('click',()=>{home();window.scrollTo({top:0});});
  app.querySelector('.opt').focus({preventScroll:true});
}
function pick(n){
  const q=order[i],ok=q.opts[n].ok;
  if(ok)score++;
  answers.push({q,ok,chosen:q.opts[n].t});
  let m=store.get(MKEY,[]);m=ok?m.filter(id=>id!==q.id):[...new Set([...m,q.id])];store.set(MKEY,m);
}
function results(){
  document.getElementById('prog').style.width='100%';
  document.getElementById('metarow').hidden=true;
  document.getElementById('run').textContent='';
  const total=order.length,pct=Math.round(score/total*100);
  const cats={};answers.forEach(a=>{const c=cats[a.q.t]??={t:0,r:0};c.t++;if(a.ok)c.r++;});
  const miss=answers.filter(a=>!a.ok),crit=answers.filter(a=>a.q.k),critMissed=crit.filter(a=>!a.ok);
  const b=band(pct,critMissed.length);
  if(!cur.code.startsWith('PRACTICE')){const res=store.get(resKey(),{});res[cur.code]={score,total,band:b.k};store.set(resKey(),res);}
  const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const lo=Math.ceil(total*.6),hi=Math.ceil(total*.8);
  app.innerHTML=`<section class="card">
    <div class="band ${b.k}"><span class="pill">${b.label}</span><div class="score">${score}/${total}</div><p class="verdict">${pct}%. ${b.text}</p></div>
    <p style="margin:0">Safety-critical questions in this test: <strong>${crit.length?`${crit.length-critMissed.length}/${crit.length} correct`:'none'}</strong></p>
    <div class="thresh"><strong>Mark bands</strong>
      <div class="tb comp"><span>Competent</span><span>${hi}+ correct and every safety-critical question right</span></div>
      <div class="tb part"><span>Partly competent</span><span>${lo}–${hi-1} correct, or ${hi}+ with a safety-critical question missed</span></div>
      <div class="tb not"><span>Not yet competent</span><span>${lo-1} or fewer correct</span></div>
    </div>
    ${miss.length?`<div style="display:flex;flex-direction:column;gap:14px"><strong>Questions to review</strong>${miss.map(a=>`<div class="miss"><p><strong>${esc(a.q.q)}</strong>${a.q.k?' <span class="crit">Safety-critical</span>':''}</p><p>You chose: ${esc(a.chosen)}</p><p class="a">Answer: ${esc(a.q.o[0])}</p><p class="note">${esc(a.q.e)}</p></div>`).join('')}</div>`:'<p style="margin:0">No mistakes. Well done.</p>'}
    <div class="sheet"><strong>Printable result sheet</strong>
      <div class="fields"><label for="cand">Name<input id="cand" placeholder="Counter assistant's name"></label><label for="assessor">Pharmacist / assessor<input id="assessor" placeholder="Optional"></label></div>
      <div class="row"><button class="btn" id="dl" hidden>Download result sheet</button></div>
      <p class="note" id="dlmsg">Opens as a page you can print or save as PDF, with the score, band, missed questions and signature lines.</p>
    </div>
    <div class="row"><button class="btn ghost" id="home">Done</button></div>
  </section>`;
  const nm=store.get('ccq-name','');if(nm)document.getElementById('cand').value=nm;
  document.getElementById('home').addEventListener('click',()=>{home();window.scrollTo({top:0});});
  const dl=document.getElementById('dl'),msg=document.getElementById('dlmsg');
  const ready=window.claude?.use?window.claude.use('downloads'):Promise.resolve(null);
  ready.then(d=>{
    if(!d)d={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/html'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return{status:'saved'};}};
    dl.hidden=false;
    dl.addEventListener('click',async()=>{
      const name=document.getElementById('cand').value.trim(),asr=document.getElementById('assessor').value.trim();
      store.set('ccq-name',name);
      const html=sheetHTML({name,asr,date,score,total,pct,b,cats,crit,critMissed,miss,lo,hi});
      const fn=`Counter result ${(name||'candidate').replace(/[^\w\- ]+/g,'')} ${cur.code}.html`;
      try{await d.save({filename:fn,data:html});msg.textContent='Saved. Open the file and use its Print button (or Ctrl+P / Cmd+P).';}
      catch(e){msg.textContent=e&&e.code==='declined'?'Download cancelled.':'The download didn’t work here. Try again in a moment.';}
    });
  }).catch(()=>{msg.textContent='Downloading isn’t available here.';});
}
function sheetHTML(r){
  const col={comp:'#1d7f45',part:'#a86a00',not:'#b3362d'}[r.b.k];
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bourne Pharmacy counter result</title>
<style>@page{size:A4;margin:16mm}body{font-family:Arial,Helvetica,sans-serif;color:#17231d;max-width:760px;margin:24px auto;padding:0 16px;font-size:14px;line-height:1.45}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #0a3fa8;padding-bottom:4px}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.muted{color:#5b6b62}
.res{border:2px solid ${col};border-radius:8px;padding:14px 16px;margin-top:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big{font-size:34px;font-weight:700}.lab{font-size:20px;font-weight:700;color:${col}}
table{width:100%;border-collapse:collapse}td,th{border:1px solid #c9d4ce;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3f0}
.q{page-break-inside:avoid;margin-bottom:10px}.ok{color:#1d7f45;font-weight:700}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}.sig div{border-top:1px solid #17231d;padding-top:4px}
.pb{background:#0a3fa8;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:14px;cursor:pointer}@media print{.pb{display:none}}</style></head><body>
<p><button class="pb" onclick="window.print()">Print</button></p>
<div class="top"><div><img src="${LOGO}" alt="Bourne Pharmacy" style="height:56px;display:block;margin-bottom:6px"><h1>Counter Skills Check</h1><div class="muted">${esc(cur.title)} · Test code ${esc(cur.code)} · ${r.total} questions</div></div>
<div><strong>Name:</strong> ${esc(r.name)||'____________________'}<br><strong>Date:</strong> ${esc(r.date)}${r.asr?`<br><strong>Assessor:</strong> ${esc(r.asr)}`:''}</div></div>
<div class="res"><div class="big">${r.score}/${r.total}</div><div><div class="lab">${r.b.label} (${r.pct}%)</div><div>${esc(r.b.text)}</div><div class="muted">Safety-critical questions correct: ${r.crit.length?`${r.crit.length-r.critMissed.length}/${r.crit.length}`:'none in this test'}</div></div></div>
<h2>Mark bands</h2><table><tr><th>Band</th><th>Requirement</th></tr>
<tr><td>Competent</td><td>${r.hi}+ correct and every safety-critical question right</td></tr>
<tr><td>Partly competent</td><td>${r.lo}–${r.hi-1} correct, or ${r.hi}+ with a safety-critical question missed</td></tr>
<tr><td>Not yet competent</td><td>${r.lo-1} or fewer correct</td></tr></table>
<h2>Score by topic</h2><table><tr><th>Topic</th><th>Correct</th></tr>${Object.entries(r.cats).map(([c,o])=>`<tr><td>${esc(c)}</td><td>${o.r}/${o.t}</td></tr>`).join('')}</table>
<h2>Questions to review</h2>${r.miss.length?r.miss.map((a,n)=>`<div class="q"><strong>${n+1}. ${esc(a.q.q)}</strong>${a.q.k?' <em>(safety-critical)</em>':''}<br>Chose: ${esc(a.chosen)}<br><span class="ok">Correct answer: ${esc(a.q.o[0])}</span><br><span class="muted">${esc(a.q.e)}</span></div>`).join(''):'<p>No questions missed.</p>'}
<h2>Action plan</h2><p style="min-height:60px;border:1px solid #c9d4ce;border-radius:6px"></p>
<div class="sig"><div>Counter assistant signature</div><div>Pharmacist signature</div></div>
<p class="muted" style="margin-top:20px">Question bank cycle ${META.cycle}, updated ${esc(META.updated)}. Based on UK practice. Local SOPs take priority.</p></body></html>`;
}

Promise.resolve(window.__BANK).then(data=>{
  META=data.meta;BANK=data.questions;
  BANK.forEach(q=>{(byTopic[q.t]??=[]).push(q.id);});
  TOPICS=Object.keys(byTopic);
  const idx=Object.fromEntries(BANK.map(q=>[q.id,q]));
  Object.keys(byTopic).forEach(t=>{byTopic[t]=byTopic[t].map(id=>idx[id]);});
  const ti=todayIndex();
  viewWeek=ti.week!=null?ti.week:store.get('ccq-week',0);
  const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('sub').textContent=`Cycle ${META.cycle} · ${fmt(dateFor(0))} to ${fmt(dateFor(19))} · 5 tests a day, 10 questions each`;
  home();
}).catch(()=>{app.innerHTML='<section class="card"><p style="margin:0">The questions couldn’t be loaded. Refresh the page to try again.</p></section>';});
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
