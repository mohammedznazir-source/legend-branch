<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single centred column. Home = timetable of 4 weeks x 5 days x 5 tests; test view = one scenario card at a time */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --fg:#0f1d3a; --muted:#56627a; --line:#d5ddec;
  --accent:#0a3fa8; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --good:#1d7f45; --good-soft:#e3f4e8; --bad:#b3362d; --bad-soft:#fbe7e4; --warn:#a86a00; --warn-soft:#fbf0d9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1222; --surface:#121c33; --fg:#e7edf8; --muted:#9aa8c2; --line:#26344f;
  --accent:#7aa5ff; --accent-ink:#071226; --accent-soft:#18284a;
  --good:#5ed48c; --good-soft:#15301f; --bad:#ff8a7e; --bad-soft:#3a1a17; --warn:#f0b54a; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1222; --surface:#121c33; --fg:#e7edf8; --muted:#9aa8c2; --line:#26344f;
  --accent:#7aa5ff; --accent-ink:#071226; --accent-soft:#18284a;
  --good:#5ed48c; --good-soft:#15301f; --bad:#ff8a7e; --bad-soft:#3a1a17; --warn:#f0b54a; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;gap:14px}
.cross{width:40px;height:40px;flex:none;position:relative}
.cross::before,.cross::after{content:"";position:absolute;background:var(--accent);border-radius:4px}
.cross::before{left:13px;top:0;width:14px;height:40px}.cross::after{top:13px;left:0;height:14px;width:40px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.q{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.35;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);color:var(--fg)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:.85rem}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right b{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong b{background:var(--bad);color:var(--surface)}
.fb{border-radius:10px;padding:14px 16px;background:var(--accent-soft)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--good)}.fb.no strong{color:var(--bad)}
.btn{all:unset;box-sizing:border-box;align-self:flex-end;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 22px;border-radius:10px;cursor:pointer;text-align:center}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-size:1.05rem;margin:0}
table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right}
.miss{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.miss p{margin:0}.miss .a{color:var(--good);font-weight:700}
.note{font-size:.85rem;color:var(--muted);margin:0}
.band{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;border:2px solid var(--bc);background:var(--bs)}
.comp{--bc:var(--good);--bs:var(--good-soft)}.part{--bc:var(--warn);--bs:var(--warn-soft)}.not{--bc:var(--bad);--bs:var(--bad-soft)}
.pill{align-self:flex-start;background:var(--bc);color:var(--surface);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.thresh{display:flex;flex-direction:column;gap:6px}
.tb{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 10px;border-left:4px solid var(--bc);background:var(--bs);border-radius:6px;font-size:.92rem}
.tb span:first-child{font-weight:700}
.crit,.new{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;border-radius:99px;padding:1px 8px;vertical-align:middle}
.crit{color:var(--bad)}.new{color:var(--warn)}
.sheet{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:700;min-width:0}
.fields input{font:inherit;font-weight:400;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
.fields input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
/* timetable */
.weeks{display:flex;gap:6px;flex-wrap:wrap}
.wk{all:unset;cursor:pointer;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:.92rem}
.wk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.grid .h{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;align-self:end}
.day{font-weight:700;font-size:.9rem;display:flex;flex-direction:column;justify-content:center;padding-right:6px;line-height:1.2}
.day small{font-weight:400;color:var(--muted);font-size:.75rem}
.day.today{color:var(--accent)}
.slot{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:8px;min-height:46px;display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;background:var(--surface)}
.slot:hover{border-color:var(--accent)}.slot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.slot.today{border-color:var(--accent);background:var(--accent-soft)}
.slot.done{color:var(--surface)}.slot.done.comp{background:var(--good);border-color:var(--good)}.slot.done.part{background:var(--warn);border-color:var(--warn)}.slot.done.not{background:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--bc);margin-right:5px;vertical-align:middle}
.practice{display:grid;grid-template-columns:1fr;gap:10px}
#app{display:flex;flex-direction:column;gap:14px}
.rules{align-items:center;text-align:center;gap:12px}
.rules .big2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;text-wrap:balance}
.rules .note{max-width:34ch}
.rules .btn{align-self:center}
.practice .btn{align-self:stretch}
.changes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.logo{background:#ffffff;border-radius:12px;padding:8px 12px;align-self:center;max-width:100%;border:1px solid var(--line)}
.logo img{display:block;height:72px;width:auto;max-width:100%;object-fit:contain}
header{flex-direction:column;align-items:center;text-align:center;position:relative}
#sub{display:none}
.gear{all:unset;cursor:pointer;position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1.5px solid var(--line);background:var(--surface)}
.gear:hover{color:var(--accent);border-color:var(--accent)}.gear:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gear[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.hero{align-items:center;text-align:center;gap:18px;padding-block:40px}
.hero .big{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;text-wrap:balance}
.start{align-self:center;font-size:1.2rem;padding:18px 44px;border-radius:14px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem}
.linkbtn:focus-visible{outline:3px solid var(--accent)}
@media (max-width:480px){.card{padding:16px}.q{font-size:1.12rem}h1{font-size:1.4rem}.tb{grid-template-columns:1fr;gap:2px}.fields,.practice{grid-template-columns:1fr}.slot{min-height:42px;font-size:.82rem}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<script>window.__BANK={"meta": {"cycle": 1, "cycleStart": "2026-11-23", "updated": "2026-11-23", "refreshDue": "2026-12-18", "changes": ["First question bank: 200 questions across 10 topics.", "Questions marked New / updated cover recent changes: Pharmacy First, pholcodine withdrawal, desogestrel and Gina pharmacy sales, stimulant laxative age limits, weight-loss injections.", "Answer options rewritten so the correct answer is no longer given away by being the longest or the only one mentioning the pharmacist."]}, "questions": [{"id": "law01", "t": "Questioning & law", "q": "In the WWHAM questions, what does the \"A\" stand for?", "o": ["Action already taken", "Any allergies they have", "Age of the patient", "Any other symptoms"], "e": "WWHAM: Who is it for, What are the symptoms, How long have they had them, Action already taken, Medication they already take."}, {"id": "law02", "t": "Questioning & law", "q": "A customer asks for \"something for my mum's cough\". Who should your questions be about?", "o": ["The mum, who will be taking it", "The customer, as they are buying it", "Nobody, as cough mixtures are GSL", "The customer, and tell the pharmacist"], "e": "\"Who is it for?\" comes first. Every question about symptoms, conditions and other medicines is about the person who will take it."}, {"id": "law03", "t": "Questioning & law", "q": "What is a P (Pharmacy) medicine?", "o": ["Sold only in a pharmacy, under a pharmacist's supervision", "Sold only in a pharmacy, and only when a prescription is shown", "Sold by any pharmacy staff, with no pharmacist needed", "Sold only in a pharmacy, and only to people over 18"], "e": "GSL: any shop. P: pharmacy only, with a pharmacist supervising. POM: prescription only."}, {"id": "law04", "t": "Questioning & law", "q": "What does GSL (General Sales List) mean?", "o": ["It can also be sold in shops like supermarkets, without a pharmacist", "It can only be sold in a pharmacy, though any staff member can sell it", "It can be sold anywhere, as long as a pharmacist has approved the sale", "It is on the NHS general list, so it needs a prescription to be supplied"], "e": "GSL medicines can be sold from any lockable retail premises. They still carry warnings, so you should still ask questions in a pharmacy."}, {"id": "law05", "t": "Questioning & law", "q": "A customer asks to buy a POM (prescription-only medicine) without a prescription. What do you do?", "o": ["Explain it needs a prescription, and pass them to the pharmacist", "Sell it if they've had it on prescription before, and tell the pharmacist", "Sell it if they show you the empty box from their last supply", "Sell one small pack to tide them over until they see the GP"], "e": "POMs can't be sold over the counter. The pharmacist can advise on other options or an emergency supply where the rules allow."}, {"id": "law06", "t": "Questioning & law", "q": "A customer wants to buy four packs of paracetamol at once. What do you do?", "o": ["Explain that sales are limited (usually no more than 2 packs) and involve the pharmacist", "Sell all four, as paracetamol is a GSL medicine and has no limit on sales", "Ring them through as two separate sales of two packs each, so the till allows it", "Sell all four if they say the packs are for different people at home"], "e": "Pack sizes and quantities of paracetamol are restricted to reduce overdose risk. Follow your pharmacy's SOP, and never split a sale to get round the limit."}, {"id": "law07", "t": "Questioning & law", "q": "The pharmacist has left the building. A customer wants a P medicine. What do you do?", "o": ["Explain P medicines can't be sold until the pharmacist is back; GSL items can still be sold", "Sell it, as the pharmacist stays signed in as the Responsible Pharmacist for up to 2 hours away", "Sell it and tell the pharmacist about the sale as soon as they get back", "Phone the pharmacist for permission, then sell it while they're still out"], "e": "P medicines can only be sold under the supervision of a pharmacist. While the responsible pharmacist is absent, P medicines must not be sold."}, {"id": "law08", "t": "Questioning & law", "q": "Which notice must be displayed in the pharmacy whenever it is open?", "o": ["The Responsible Pharmacist notice, showing their name and registration number", "The staff rota, showing which pharmacist is working each day", "A list of staff on duty that day, showing each person's training level", "A price list for all P medicines, signed by the pharmacist"], "e": "The law requires the Responsible Pharmacist (RP) notice to be on display so the public can see who is in charge."}, {"id": "law09", "t": "Questioning & law", "q": "A customer seems drunk and asks for a codeine painkiller. What do you do?", "o": ["Tell the pharmacist, who decides whether the sale is appropriate", "Sell it quickly and quietly, to avoid upsetting other customers", "Sell the smallest pack only, then let the pharmacist know afterwards", "Refuse the sale yourself, and ask them to leave the pharmacy"], "e": "Suspected misuse, intoxication or a pattern of buying should always go to the pharmacist. Stay calm and discreet."}, {"id": "law10", "t": "Questioning & law", "q": "Someone asks what medicines their neighbour collects from your pharmacy. What do you do?", "o": ["Politely refuse, as it's confidential", "Tell them if they live at the same address", "Check with the pharmacist, then tell them", "Tell them only the names, not the doses"], "e": "Patient information must stay confidential. Only share information with the patient, or with someone they have authorised, under your SOP."}, {"id": "law11", "t": "Questioning & law", "q": "A customer starts to describe embarrassing symptoms at a busy counter. What is the best thing to do?", "o": ["Offer to talk in the consultation room or a quieter area", "Ask them to come back later when the pharmacy is quieter", "Ask them to lower their voice and carry on at the counter", "Pass them a leaflet and refer them to their GP instead"], "e": "Privacy encourages honest answers. Offer the consultation room for sensitive conversations."}, {"id": "law12", "t": "Questioning & law", "q": "What is an SOP?", "o": ["A written Standard Operating Procedure for how a task is done", "A Supply on Prescription form, used for NHS prescriptions", "A Special Order Product, ordered in for one patient", "A Standard Order Plan, setting how much stock is kept in the pharmacy"], "e": "SOPs make sure everyone does tasks such as selling medicines the same, safe way. Read and sign the SOPs for your role."}, {"id": "law13", "t": "Questioning & law", "q": "Under GPhC requirements, when must staff who sell medicines be enrolled on an accredited training course?", "o": ["Within 3 months of starting the role", "Within 12 months of starting the role", "Within 6 months, if they work full time", "Within 2 years of starting the role"], "e": "The GPhC expects staff involved in selling medicines to be enrolled on an accredited course within 3 months of starting."}, {"id": "law14", "t": "Questioning & law", "q": "In the ASMETHOD questions, what does the \"E\" stand for?", "o": ["Extra medicines", "Existing conditions", "Emergency signs", "Eating and drinking"], "e": "ASMETHOD: Age/appearance, Self or someone else, Medication, Extra medicines, Time persisting, History, Other symptoms, Danger symptoms."}, {"id": "law15", "t": "Questioning & law", "q": "In ASMETHOD, what does the \"D\" stand for?", "o": ["Danger symptoms", "Duration of symptoms", "Dose already taken", "Doctor's details"], "e": "Danger (red flag) symptoms mean referral, not a sale."}, {"id": "law16", "t": "Questioning & law", "q": "Why is \"How long have you had the symptoms?\" an important question?", "o": ["Long-lasting symptoms may need referral rather than a sale", "New symptoms need referral to the GP before anything is sold", "It tells you which brand will work fastest for the customer", "The pharmacist needs it written in the sales record"], "e": "Many minor ailments clear up in a set time. Symptoms that last longer than expected can be a sign of something more serious."}, {"id": "law17", "t": "Questioning & law", "q": "The pharmacist has decided not to sell a product, but the customer insists. What do you do?", "o": ["Politely explain the decision is for their safety, and offer alternatives or signposting", "Ask the pharmacist to reconsider, and sell it if the customer still insists", "Suggest they come back later when a different pharmacist is on duty", "Sell a smaller pack as a compromise, and note it in the refusals log"], "e": "The pharmacist's decision on a sale is final. Stay polite and explain what else could help."}, {"id": "law18", "t": "Questioning & law", "q": "An MHRA drug alert says a batch of a product you stock is being recalled. What do you do?", "o": ["Remove the affected batch from sale and follow the pharmacist's and SOP instructions", "Check the boxes look undamaged, and keep selling them if they look fine", "Keep selling until the recall deadline, then tell the pharmacist what's left", "Throw the affected batch in the general bin straight away, then tell the pharmacist"], "e": "Recalled stock must be removed from sale, kept separate (quarantined) and returned or destroyed as directed."}, {"id": "law19", "t": "Questioning & law", "q": "You find a medicine past its expiry date on the shelf. What do you do?", "o": ["Remove it from sale and deal with it under your SOP (usually pharmaceutical waste)", "Leave it if it's less than a month out of date, and tell the pharmacist", "Sell it at a reduced price, as long as the customer is told it's expired", "Put it in the household bin, then let the pharmacist know at the end of the day"], "e": "Expired medicines must never be sold. Check dates when stocking and facing up shelves."}, {"id": "law20", "t": "Questioning & law", "q": "A customer brings in a bag of old, unwanted medicines. What do you do?", "o": ["Accept them for safe disposal, following your SOP", "Explain they should go in the household bin, wrapped up", "Accept them, and return any unopened packs to the shelf", "Refuse them, and tell them to take them to the GP surgery"], "e": "Pharmacies take back patients' unwanted medicines for safe disposal. Returned medicines must never be resold. Sharps usually need separate arrangements."}, {"id": "pain01", "t": "Pain & fever", "q": "What is the maximum dose of paracetamol 500mg tablets for a healthy adult?", "o": ["2 tablets every 4–6 hours, no more than 8 tablets in 24 hours", "2 tablets every 4 hours, no more than 12 tablets in each 24 hours", "1–2 tablets every 2 hours, no more than 10 tablets a day", "3 tablets every 6 hours, no more than 12 tablets in 24 hours"], "e": "1g (2 × 500mg) per dose, at least 4 hours apart, no more than 4g (8 tablets) in 24 hours."}, {"id": "pain02", "k": 1, "t": "Pain & fever", "q": "A customer with flu is buying Lemsip Max sachets and paracetamol tablets. What do you say?", "o": ["Explain Lemsip already contains paracetamol, so they mustn't take both together", "Sell both, but suggest seeing the pharmacist if the flu lasts over a week", "Advise taking the tablets in the day and Lemsip at night only", "Sell both, and tell them to leave 2 hours between Lemsip and tablets"], "e": "Many cold and flu products contain paracetamol. Taking two together risks an overdose. Always check the active ingredients."}, {"id": "pain03", "t": "Pain & fever", "q": "A customer asks for \"the strongest painkiller you have\" and points to a codeine product. What do you do?", "o": ["Ask your questions and involve the pharmacist", "Sell it straight away, as they asked for it by name", "Refuse, and refer them to the GP for anything stronger", "Sell it, and tell the pharmacist afterwards"], "e": "OTC codeine is for short-term use only because of the risk of addiction. Questions and pharmacist involvement are needed."}, {"id": "pain04", "k": 1, "t": "Pain & fever", "q": "A customer who takes warfarin asks for ibuprofen for back pain. What do you do?", "o": ["Refer them to the pharmacist", "Sell the gel, as it isn't absorbed", "Sell it for a few days only", "Suggest aspirin, as it's gentler"], "e": "NSAIDs such as ibuprofen and aspirin increase the bleeding risk with warfarin. The pharmacist will usually suggest paracetamol."}, {"id": "pain05", "t": "Pain & fever", "q": "Which customer should you NOT sell ibuprofen to without checking with the pharmacist?", "o": ["Someone who has had a stomach ulcer", "A 30-year-old woman with period pain", "Someone who has taken it before safely", "A healthy adult with a sprained ankle"], "e": "Check with the pharmacist for anyone with a past stomach ulcer, kidney or heart problems, asthma made worse by NSAIDs, pregnancy, or blood thinners."}, {"id": "pain06", "t": "Pain & fever", "q": "A dad asks for aspirin for his 12-year-old's headache. What do you say?", "o": ["Aspirin isn't given to under-16s; offer a children's paracetamol or ibuprofen product", "Soluble aspirin is fine for children, as it's much gentler on a young stomach than tablets", "Aspirin is fine from age 12, but do check with the pharmacist which strength to give", "It's fine if taken with food, as long as it's for no more than 3 days"], "e": "Aspirin must not be given to under-16s except on a doctor's advice, because of Reye's syndrome."}, {"id": "pain07", "t": "Pain & fever", "q": "For how long can OTC codeine painkillers be taken?", "o": ["No more than 3 days", "No more than 7 days", "No more than 5 days", "Up to 2 weeks at a time"], "e": "The pack says no more than 3 days. Longer use risks addiction and medication-overuse headache."}, {"id": "pain08", "t": "Pain & fever", "q": "A customer wants to buy co-codamol but already takes co-codamol on prescription. What do you do?", "o": ["Refer them to the pharmacist", "Sell it, as OTC strength is lower", "Sell it for use at night only", "Suggest codeine linctus instead"], "e": "Doubling up on the same ingredients risks overdose. Always ask about prescribed medicines."}, {"id": "pain09", "t": "Pain & fever", "q": "A pregnant customer wants something for a headache. What is the usual approach?", "o": ["Involve the pharmacist; paracetamol is usually preferred and ibuprofen avoided", "Involve the pharmacist; ibuprofen is usually preferred and paracetamol avoided", "Sell a codeine product, as it's stronger and works faster than paracetamol", "Sell ibuprofen, as it's safe in pregnancy if taken with food for short spells"], "e": "Paracetamol is generally preferred in pregnancy. Ibuprofen should be avoided, especially later in pregnancy. Always involve the pharmacist."}, {"id": "pain10", "t": "Pain & fever", "q": "What is the maximum OTC daily dose of ibuprofen for an adult?", "o": ["1200mg a day (e.g. 400mg three times a day)", "2400mg a day (e.g. 800mg three times a day)", "1600mg a day (e.g. 400mg four times a day)", "800mg a day (e.g. 200mg four times a day)"], "e": "The OTC maximum is 1200mg a day. Higher doses are prescription only."}, {"id": "pain11", "t": "Pain & fever", "q": "A 17-year-old with migraines asks for sumatriptan tablets (Imigran Recovery). What do you do?", "o": ["Explain OTC sumatriptan is only for adults aged 18–65 with diagnosed migraine, and involve the pharmacist", "Sell it if a parent or guardian is with them, and tell the pharmacist afterwards", "Sell it, as OTC sumatriptan is licensed from age 12 for anyone with diagnosed migraine", "Explain OTC sumatriptan is for anyone over 16 with migraine, so sell it after your usual questions"], "e": "OTC sumatriptan is for ages 18–65 with an established migraine diagnosis. The pharmacist makes the sale."}, {"id": "pain12", "k": 1, "t": "Pain & fever", "q": "A customer describes a sudden, severe \"worst ever\" headache with a stiff neck. What do you do?", "o": ["Treat it as an emergency: get the pharmacist and call 999", "Refer them to the GP today, and sell a strong painkiller meanwhile", "Suggest a lie-down in a dark room and plenty of fluids", "Get the pharmacist, who can sell something for migraine"], "e": "A sudden severe headache, stiff neck, rash, confusion or headache after a head injury are emergencies."}, {"id": "pain13", "t": "Pain & fever", "q": "A customer buys painkillers for headaches nearly every day. What could be happening?", "o": ["Medication-overuse headache; refer to the pharmacist", "The painkiller has stopped working; suggest a stronger one", "Tolerance to the brand; suggest switching to a different one", "Nothing to worry about, as long as they stick to the pack dose"], "e": "Taking painkillers on many days a month can itself cause headaches. Refer, and don't simply sell more."}, {"id": "pain14", "t": "Pain & fever", "q": "What is the first-aid advice for a sprained ankle in the first 48 hours?", "o": ["Rest, ice (wrapped), compression and elevation (RICE)", "Rest, heat (a hot water bottle), compression and elevation", "Gentle massage and a warming rub to get the blood flowing", "Keep walking on it normally so the ankle doesn't stiffen up"], "e": "RICE in the first couple of days. Refer if the person can't bear weight, there is severe pain or the joint looks deformed."}, {"id": "pain15", "k": 1, "t": "Pain & fever", "q": "A customer with back pain mentions numbness around their bottom and problems passing urine. What do you do?", "o": ["Treat it as an emergency: involve the pharmacist and advise A&E or 999 now", "Refer them to the pharmacist, who will suggest a GP appointment this week", "Sell ibuprofen gel and suggest a hot water bottle for the pain", "Suggest a GP appointment if the numbness is still there in a few weeks"], "e": "These are signs of cauda equina syndrome, which needs emergency care."}, {"id": "pain16", "t": "Pain & fever", "q": "Which medicine is licensed OTC specifically for period pain, for women aged 15–50?", "o": ["Naproxen (e.g. Feminax Ultimate)", "Mefenamic acid (e.g. Ponstan Forte)", "Loperamide (e.g. Imodium)", "Aspirin 75mg dispersible"], "e": "Naproxen 250mg is a P medicine for period pain in women aged 15–50. Ask the usual NSAID safety questions."}, {"id": "pain17", "t": "Pain & fever", "q": "A customer takes low-dose aspirin 75mg daily for their heart and wants ibuprofen. What do you do?", "o": ["Refer to the pharmacist before any sale", "Sell it, as 75mg aspirin is too low to matter", "Sell it and suggest skipping the aspirin that day", "Sell extra aspirin for the pain instead"], "e": "Two NSAIDs together raise the bleeding risk. The pharmacist will advise, often paracetamol."}, {"id": "pain18", "t": "Pain & fever", "q": "A customer who drinks heavily every day wants paracetamol. What do you do?", "o": ["Involve the pharmacist before selling", "Sell it, as paracetamol is safe with alcohol", "Sell it, but advise taking it with food", "Sell it if they promise not to drink that day"], "e": "Regular heavy drinking, liver disease and low body weight increase paracetamol risk. The pharmacist may advise a lower dose."}, {"id": "pain19", "t": "Pain & fever", "q": "A customer has toothache. What is the right advice?", "o": ["A painkiller for short-term relief, and see a dentist", "See the GP for antibiotics, and a painkiller meanwhile", "Rub a crushed aspirin on the gum next to the tooth", "Use clove oil and only see a dentist if it lasts a month"], "e": "Dental pain needs a dentist, or NHS 111 out of hours. Never put aspirin on the gum, as it burns."}, {"id": "pain20", "k": 1, "t": "Pain & fever", "q": "A customer says they took more paracetamol than the pack allows over the past day, but feels fine. What do you advise?", "o": ["Get urgent medical advice now (NHS 111 or A&E), even though they feel well", "Tell the pharmacist, and book a GP appointment if any symptoms start to appear", "Drink plenty of water and wait to see if they feel unwell", "Stop the paracetamol and switch to ibuprofen for the next few days"], "e": "Paracetamol overdose may cause no symptoms at first, but liver damage can still happen. Urgent treatment is needed."}, {"id": "resp01", "t": "Coughs, colds & allergy", "q": "A mum wants a cough and cold medicine for her 4-year-old. What is the right response?", "o": ["Explain most cough and cold medicines aren't suitable under 6; involve the pharmacist, who may suggest a simple linctus", "Sell a children's cough syrup with an antihistamine, as these are made for young children and help them sleep", "Sell an adult cough medicine at half the dose, and let the pharmacist know afterwards so it can be noted", "Explain most cough medicines are fine from age 2, and sell a children's decongestant syrup, checking the dose with the pharmacist"], "e": "OTC cough and cold medicines with antihistamines or decongestants shouldn't be used under 6. For ages 6–12, use only on pharmacist advice."}, {"id": "resp02", "t": "Coughs, colds & allergy", "q": "A customer wants two packs of pseudoephedrine tablets (e.g. Sudafed Decongestant). What do you do?", "o": ["Explain only one pack can be sold per sale, and ask about blood pressure and other medicines", "Sell both packs, as the one-pack limit only applies to pseudoephedrine sprays, not tablets", "Check with the pharmacist, then sell both if the customer says they're for two different people", "Sell one pack now and let them come back for the second later the same day, as that's a new sale"], "e": "Pseudoephedrine is limited to one pack (max 720mg) per sale because of misuse."}, {"id": "resp03", "t": "Coughs, colds & allergy", "q": "A customer has had a cough for 4 weeks and tried two cough medicines. What do you do?", "o": ["Refer them so the cough can be properly checked", "Sell a stronger cough medicine for another week", "Suggest a different brand with another ingredient", "Suggest honey and lemon, and check back in a month"], "e": "A cough lasting more than 3 weeks, coughing up blood, chest pain or breathlessness all need referral."}, {"id": "resp04", "t": "Coughs, colds & allergy", "q": "A lorry driver wants a hay fever tablet. Which is most suitable?", "o": ["A non-drowsy antihistamine such as cetirizine or loratadine", "Chlorphenamine (Piriton), as it's the strongest for hay fever", "Promethazine, taken at night so it has worn off by the morning", "A diphenhydramine tablet, as it's sold for allergies too"], "e": "Older antihistamines cause drowsiness, which is dangerous when driving."}, {"id": "resp05", "t": "Coughs, colds & allergy", "q": "What is the maximum time a decongestant nasal spray such as xylometazoline should be used?", "o": ["No more than about 7 days", "Up to about 4 weeks", "As long as the nose is blocked", "Only at night, any length"], "e": "Overuse causes rebound congestion. Check the pack and advise against using it for more than 7 days."}, {"id": "resp06", "k": 1, "t": "Coughs, colds & allergy", "q": "A customer with a sore throat can't swallow their saliva and is struggling to breathe. What do you do?", "o": ["Treat it as an emergency: get the pharmacist and call 999", "Get the pharmacist to recommend a strong throat spray", "Sell a throat spray and advise seeing a GP if no better in a week", "Book them a Pharmacy First sore throat appointment for later today"], "e": "Difficulty breathing, drooling or being unable to swallow are emergency signs."}, {"id": "resp07", "u": 1, "t": "Coughs, colds & allergy", "q": "Under Pharmacy First in England, from what age can the pharmacist assess a sore throat?", "o": ["5 years and over", "12 years and over", "16 years and over", "1 year and over"], "e": "Pharmacy First covers acute sore throat for ages 5+. The pharmacist decides whether antibiotics are needed."}, {"id": "resp08", "u": 1, "t": "Coughs, colds & allergy", "q": "Under Pharmacy First, from what age can the pharmacist assess sinusitis?", "o": ["12 years and over", "5 years and over", "Adults (18 and over)", "1 year and over"], "e": "Pharmacy First covers acute sinusitis for ages 12+."}, {"id": "resp09", "t": "Coughs, colds & allergy", "q": "A customer with a cold mentions coughing up blood. What do you do?", "o": ["Refer them to the pharmacist, then on to a GP", "Sell a chesty cough mixture to help clear it up", "Sell a decongestant and tell the pharmacist later", "Suggest steam, and refer them if it continues for a week"], "e": "Coughing up blood is a red flag and needs medical assessment."}, {"id": "resp10", "t": "Coughs, colds & allergy", "q": "A 15-year-old wants a steroid hay fever nasal spray (beclometasone). What do you do?", "o": ["Explain OTC steroid nasal sprays are for adults 18+, and involve the pharmacist", "Sell it, as these sprays are licensed for anyone aged 12 and over", "Sell it, but advise using just one spray a day instead of two", "Suggest a decongestant spray instead, as it can be used all season"], "e": "OTC beclometasone and fluticasone nasal sprays are licensed for 18+. The pharmacist can suggest a suitable option."}, {"id": "resp11", "t": "Coughs, colds & allergy", "q": "A customer with high blood pressure wants a decongestant tablet. What do you do?", "o": ["Involve the pharmacist, as decongestants can raise blood pressure", "Sell it, and suggest they take it only at bedtime each night", "Sell it, as long as their blood pressure tablets are working well", "Sell it, as long as they check their blood pressure at home each day"], "e": "Oral decongestants aren't suitable for people with high blood pressure, heart problems, overactive thyroid and some other conditions."}, {"id": "resp12", "t": "Coughs, colds & allergy", "q": "Which ingredient is used in cough medicines for a chesty (productive) cough?", "o": ["Guaifenesin (an expectorant)", "Dextromethorphan (a suppressant)", "Chlorphenamine (an antihistamine)", "Pholcodine (a suppressant)"], "e": "Expectorants such as guaifenesin are for chesty coughs. Suppressants are for dry, tickly coughs."}, {"id": "resp13", "u": 1, "t": "Coughs, colds & allergy", "q": "Why are pholcodine cough medicines no longer sold in the UK?", "o": ["Withdrawn in 2023 due to risk of serious allergic reactions to anaesthetics", "They became prescription-only in 2023 because of misuse by teenagers", "They were withdrawn in 2023 because they caused drowsiness in drivers", "They were withdrawn in 2023 after being linked to breathing problems in children"], "e": "The MHRA withdrew pholcodine in March 2023. Check that any you find are out of stock."}, {"id": "resp14", "t": "Coughs, colds & allergy", "q": "What warning should you give with a drowsy antihistamine such as chlorphenamine?", "o": ["It may cause drowsiness, so don't drive and avoid alcohol", "It may cause drowsiness, so take it in the morning before driving", "None needed, as modern antihistamines are all non-drowsy", "It may cause drowsiness, but coffee will counter it, so driving is fine"], "e": "Sedating antihistamines affect driving and operating machinery, and alcohol makes it worse."}, {"id": "resp15", "t": "Coughs, colds & allergy", "q": "A pregnant customer asks if she can have the flu vaccine. What is correct?", "o": ["Yes; it's free on the NHS in pregnancy and many pharmacies offer it", "Only after the first 12 weeks, so check with the pharmacist then", "No, it isn't advised in pregnancy, but she can have it after the birth", "Only if she also has asthma or another long-term condition"], "e": "The NHS flu vaccine is recommended in pregnancy at any stage. Pass her to the pharmacist for the service."}, {"id": "resp16", "t": "Coughs, colds & allergy", "q": "A customer with asthma says their cold has made them very breathless and their inhaler isn't helping. What do you do?", "o": ["Get the pharmacist straight away; they may need urgent medical help", "Sell a chesty cough medicine and tell the pharmacist if it gets worse", "Suggest they use their inhaler more and see their GP next week", "Ask them to sit down and wait for the pharmacist's next free slot"], "e": "Worsening breathlessness in asthma or COPD needs urgent assessment."}, {"id": "resp17", "t": "Coughs, colds & allergy", "q": "A parent asks about steam inhalation with a bowl of hot water for their child's cold. What do you say?", "o": ["It isn't recommended for children", "It's fine if an adult holds the bowl", "It's fine from age 2 with a towel", "Yes, add menthol to clear the nose"], "e": "Children are at risk of serious scalds from hot water."}, {"id": "resp18", "t": "Coughs, colds & allergy", "q": "Which eye drops can be sold for itchy, watery hay fever eyes?", "o": ["Sodium cromoglicate eye drops", "Chloramphenicol antibiotic eye drops", "Hydrocortisone eye drops", "Hydrocortisone cream around the eyes"], "e": "Sodium cromoglicate eye drops help allergic eye symptoms. Chloramphenicol is for bacterial infection."}, {"id": "resp19", "t": "Coughs, colds & allergy", "q": "What is a safe option for a 3-month-old baby's blocked nose?", "o": ["Saline (salt water) nose drops", "A children's decongestant nasal spray", "Children's cold and flu sachets", "Xylometazoline drops at half dose"], "e": "Saline drops are suitable for babies. Refer if the baby is feeding poorly or has a fever."}, {"id": "resp20", "t": "Coughs, colds & allergy", "q": "A customer wants antibiotics for their cold. What do you explain?", "o": ["Colds are caused by viruses, so antibiotics don't help; rest, fluids and symptom relief do", "Antibiotics can't be sold, but the pharmacist can supply them for a cold under Pharmacy First", "Antibiotics only help once a cold has lasted 3 days, so see the GP if it carries on", "Colds are caused by bacteria, so they should ask their GP for a short course of antibiotics"], "e": "Most colds get better within 1–2 weeks on their own. Antibiotics don't work on viruses."}, {"id": "gut01", "k": 1, "t": "Stomach & bowel", "q": "A 62-year-old has new indigestion, food sticking when they swallow, and weight loss without trying. What do you do?", "o": ["Refer them urgently to their GP", "Sell an antacid and review in 2 weeks", "Sell omeprazole, as it treats reflux", "Suggest smaller meals and softer foods"], "e": "Difficulty swallowing, weight loss, vomiting blood, or new symptoms over 55 need referral, not a sale."}, {"id": "gut02", "t": "Stomach & bowel", "q": "A 16-year-old wants omeprazole for heartburn. What do you do?", "o": ["Explain OTC omeprazole is for 18+ only, and involve the pharmacist", "Sell it if a parent phones to agree, then let the pharmacist know about it", "Sell the smallest pack, as it's only for a short course", "Sell the 7-day pack, as 16 is old enough for P medicines"], "e": "OTC PPIs are licensed for 18+. The pharmacist can suggest an antacid or alginate."}, {"id": "gut03", "t": "Stomach & bowel", "q": "A parent wants loperamide for their 8-year-old's diarrhoea. What is the best response?", "o": ["Explain it isn't for under-12s; suggest oral rehydration and involve the pharmacist", "Sell it at half the adult dose, and let the pharmacist know afterwards", "Sell it for one day only, alongside oral rehydration salts, as a short course is safe", "Sell it with rehydration salts, as loperamide stops fluid loss in children"], "e": "OTC loperamide is for 12+. For children, rehydration is the priority."}, {"id": "gut04", "t": "Stomach & bowel", "q": "A 7-year-old has threadworms. What is correct?", "o": ["Treat everyone in the household at once (unless under 2 or pregnant), with strict hygiene", "Treat only the child, and wash their bedding, towels and nightwear every day", "Treat the child now, and the rest of the family only if they get symptoms", "No medicine is needed; hand washing alone clears them in a few days"], "e": "Mebendazole (from age 2) for the whole household, plus hand washing, short nails, and washing bedding and towels."}, {"id": "gut05", "t": "Stomach & bowel", "q": "A customer has bought a laxative every week for months. What do you do?", "o": ["Mention it to the pharmacist, tactfully", "Offer a bigger pack, as it's better value", "Refuse to sell any more until they see a GP", "Nothing; laxatives are safe to use long-term"], "e": "Frequent repeat purchases of laxatives, codeine or sleep aids should be discussed with the pharmacist, tactfully."}, {"id": "gut06", "t": "Stomach & bowel", "q": "What is the most important treatment for diarrhoea in an older person?", "o": ["Replacing fluids, e.g. oral rehydration salts", "Eating plain food only, such as dry toast", "Antibiotics from the shelf, to kill the bug causing it", "Avoiding drinks so the bowel can rest"], "e": "Dehydration is the main risk, especially in the very young and old. Oral rehydration salts replace lost fluid and salts."}, {"id": "gut07", "t": "Stomach & bowel", "q": "An adult has had diarrhoea for 8 days. What do you do?", "o": ["Refer them; it has gone on too long", "Sell loperamide and rehydration salts", "Sell rehydration salts; it'll settle soon", "Reassure them; 8 days is still normal"], "e": "Also refer for blood in the stool, severe pain, signs of dehydration, or recent travel abroad."}, {"id": "gut08", "t": "Stomach & bowel", "q": "What is the usual first advice for an adult with mild constipation?", "o": ["More fluids, fibre and activity; a bulk-forming laxative (e.g. ispaghula) if needed", "A strong stimulant laxative every day, since diet changes take weeks to work", "An enema first to clear the bowel, followed by a stimulant laxative if needed", "A bulk-forming laxative taken with as little water as possible, and less fruit and veg"], "e": "Lifestyle changes come first. Bulk-forming laxatives need plenty of fluid."}, {"id": "gut09", "u": 1, "t": "Stomach & bowel", "q": "A parent wants senna (a stimulant laxative) for their 8-year-old. What do you do?", "o": ["Explain stimulant laxatives aren't sold OTC for under-12s, and involve the pharmacist", "Sell it at half the adult dose, and tell the pharmacist afterwards", "Sell it, as senna is plant-based and gentle enough for young children", "Sell a liquid laxative instead, as liquids are gentler and made for children of this age"], "e": "Since 2020, OTC stimulant laxatives are for 12+ (12–17 from pharmacies only). Children need medical advice."}, {"id": "gut10", "t": "Stomach & bowel", "q": "A customer buying piles cream mentions blood mixed in their stools and a change in bowel habit for several weeks. What do you do?", "o": ["Refer them to the GP, after involving the pharmacist", "Sell the cream; see a GP if bleeding continues", "Sell the cream, as some blood is normal with piles", "Sell a laxative, as straining causes it"], "e": "Blood mixed in the stool, a change in bowel habit, weight loss or being over 40 with new symptoms need referral."}, {"id": "gut11", "t": "Stomach & bowel", "q": "Who can buy haemorrhoid creams containing hydrocortisone (e.g. Anusol Plus HC)?", "o": ["Adults 18+, for no more than 7 days", "Children over 6, for up to 7 days", "Adults 18+, for as long as symptoms last", "Anyone over 12, for up to 14 days"], "e": "Hydrocortisone haemorrhoid products are for adults, for short-term use."}, {"id": "gut12", "t": "Stomach & bowel", "q": "A customer takes several regular medicines and wants an antacid. What advice is correct?", "o": ["Check with the pharmacist about spacing the doses", "Take the antacid with the other medicines", "It's fine, as antacids never interact", "Pause the regular medicines while using it"], "e": "Antacids interfere with medicines such as some antibiotics and iron. Doses usually need to be taken at different times."}, {"id": "gut13", "t": "Stomach & bowel", "q": "A pregnant woman has heartburn. What is usually suitable?", "o": ["An alginate product such as Gaviscon, after checking with the pharmacist", "OTC omeprazole, as it's licensed for heartburn in pregnancy", "Ibuprofen to ease the burning pain, after a quick check with the pharmacist", "Bismuth tablets, as they coat the stomach and are gentle in pregnancy"], "e": "Alginates and antacids are generally suitable in pregnancy. Check with the pharmacist."}, {"id": "gut14", "t": "Stomach & bowel", "q": "A parent asks for something for their baby's colic. When should you refer?", "o": ["If the baby is not feeding well, vomiting, or has a fever", "Only if crying lasts over 10 minutes at a time", "If under 1, as colic drops aren't licensed", "Never; colic is always harmless and settles by itself"], "e": "Simeticone (e.g. Infacol) is often used. Poor feeding, vomiting, fever or a floppy baby need referral."}, {"id": "gut15", "t": "Stomach & bowel", "q": "When should travel sickness tablets usually be taken?", "o": ["Before the journey, as the pack directs", "Only once the person feels sick", "Halfway through, so it lasts longer", "After arriving, to settle the stomach"], "e": "Most travel sickness medicines work best taken before travel. Many cause drowsiness, so drivers should avoid them."}, {"id": "gut16", "k": 1, "t": "Stomach & bowel", "q": "A baby has vomited every feed for a day and has had far fewer wet nappies. What do you do?", "o": ["Get urgent medical advice for the baby now", "Sell rehydration salts and wait 3 days to see", "Sell colic drops and ask the pharmacist", "Stop feeds for a day to rest the tummy"], "e": "Babies dehydrate quickly. Fewer wet nappies, a sunken soft spot or drowsiness need urgent help."}, {"id": "gut17", "t": "Stomach & bowel", "q": "A 50-year-old with new bloating and a change in bowel habit wants an IBS product. What do you do?", "o": ["Refer them to the GP to be checked", "Sell it, and refer if no better in 2 weeks", "Sell peppermint oil, as it's natural", "Sell it; bloating at 50 is usually stress"], "e": "New bowel symptoms, especially over 40, need a GP to rule out other causes before IBS treatment."}, {"id": "gut18", "t": "Stomach & bowel", "q": "What is a common symptom of threadworms?", "o": ["An itchy bottom, especially at night", "A high fever, especially at night", "A dry cough and sore throat", "Stomach cramps after every single meal"], "e": "The worms lay eggs around the bottom at night, causing itching."}, {"id": "gut19", "t": "Stomach & bowel", "q": "How long should someone stay off work or school after diarrhoea and vomiting?", "o": ["Until 48 hours after the last episode", "Until 24 hours after the last episode", "Until 48 hours after symptoms start", "Until they feel well enough to eat"], "e": "The 48-hour rule helps stop the spread of tummy bugs."}, {"id": "gut20", "k": 1, "t": "Stomach & bowel", "q": "A customer asks for an indigestion remedy, but has chest pain spreading to the arm and jaw and is sweating. What do you do?", "o": ["Call 999 and get the pharmacist", "Sell an antacid; tell the pharmacist", "Sell an alginate and advise the GP", "Ask the pharmacist to pick an antacid"], "e": "Chest pain spreading to the arm, jaw or back, with sweating or breathlessness, is an emergency."}, {"id": "skin01", "t": "Skin", "q": "A customer wants hydrocortisone 1% cream for a rash on their face. What do you do?", "o": ["Refer to the pharmacist; OTC hydrocortisone must not be used on the face", "Sell it, but advise using it for no longer than 7 days on the face", "Sell the 0.5% strength instead, as it's mild enough for use on the face", "Sell it and let the pharmacist know afterwards in case of any side effects"], "e": "OTC hydrocortisone 1% isn't for the face, eyes, genitals, broken or infected skin, or under-10s. Maximum use is 7 days."}, {"id": "skin02", "t": "Skin", "q": "When should aciclovir cold sore cream be started?", "o": ["At the first tingling, before the blister appears", "Once the blister appears, so you know it's a cold sore", "When the blister bursts, as that's when the virus spreads", "Only if the cold sore hasn't started healing after a few days"], "e": "Antivirals work best early. Refer cold sores in babies, near the eye, in people with weak immunity, or lasting over 10 days."}, {"id": "skin03", "t": "Skin", "q": "A customer with diabetes wants a salicylic acid verruca treatment. What do you do?", "o": ["Refer to the pharmacist; it isn't suitable for people with diabetes", "Sell it, but tell them to protect the skin around the verruca", "Suggest a freezing spray instead, as it doesn't contain any acid", "Sell it and say to check with the pharmacist if the skin gets sore"], "e": "People with diabetes are at risk of foot ulcers. Refer to the pharmacist or a podiatrist."}, {"id": "skin04", "t": "Skin", "q": "A mum wants head lice treatment \"just in case\" because of an outbreak at school. What is correct?", "o": ["Only treat if live lice are found by detection combing", "Use the treatment now to protect against catching lice", "Treat the whole family now, as everyone at home could catch them", "Sell a tea tree spray to use every morning to keep lice away"], "e": "Treat only when live lice are found, using wet combing or a product such as dimeticone. Check the whole household."}, {"id": "skin05", "u": 1, "t": "Skin", "q": "An insect bite is now red, hot and spreading, and the customer feels feverish. What do you do?", "o": ["Refer to the pharmacist straight away, as it may be infected", "Sell an antihistamine cream and paracetamol for the fever", "Sell hydrocortisone cream, as redness is an allergic reaction", "Suggest a cold compress and refer to the GP if no better in a week"], "e": "Spreading redness, heat, swelling or fever suggest infection. The pharmacist can assess under Pharmacy First, or refer on."}, {"id": "skin06", "t": "Skin", "q": "What advice goes with athlete's foot cream?", "o": ["Dry carefully between the toes, don't share towels, and change socks daily", "Stop using the cream as soon as the itching stops, to avoid resistance", "Soak the feet in warm water each evening and leave the skin damp to soothe it", "Use the cream once, then wait a week to see if it has worked before using more"], "e": "Fungi like warm, damp skin. Continue treatment for as long as the pack says, even after symptoms go."}, {"id": "skin07", "t": "Skin", "q": "A customer with diabetes wants an OTC fungal nail lacquer. What do you do?", "o": ["Refer to the pharmacist; people with diabetes need nail problems checked", "Sell it, as nail lacquer stays on the nail and isn't absorbed into the body", "Sell it, but advise filing the nail short before each application", "Sell it and suggest they check with their GP if it's no better in a month"], "e": "OTC amorolfine is for adults with up to 2 mildly affected nails. People with diabetes or poor circulation should be referred."}, {"id": "skin08", "t": "Skin", "q": "What should you warn a customer about benzoyl peroxide acne gel?", "o": ["It can bleach clothes, towels and bedding", "It clears spots in a day or two, or it isn't working", "It should be rubbed in thickly, several times a day", "It makes the skin more oily for the first few weeks"], "e": "Benzoyl peroxide can bleach fabric and may cause dryness or irritation at first. It takes several weeks to work."}, {"id": "skin09", "t": "Skin", "q": "When should someone with acne be referred?", "o": ["If acne is severe, scarring, with painful lumps or cysts, or causing distress", "Only if spots haven't cleared after a few days of using an OTC gel or wash", "Only if the person is over 25, as teenage acne always clears up by itself", "If they have more than a few spots on their face at the same time"], "e": "Severe or scarring acne needs prescription treatment."}, {"id": "skin10", "t": "Skin", "q": "What safety warning goes with emollient creams (including paraffin-free ones)?", "o": ["Fabric with emollient on it can catch fire easily; avoid flames and smoking", "Only paraffin creams are a fire risk, so paraffin-free ones are safe near flames", "They must be kept in the fridge once opened, or they go off very quickly", "Washing clothes at 30°C removes the emollient, so there's no fire risk"], "e": "The MHRA warns that dressings, clothing and bedding with dried-on emollient are a fire hazard."}, {"id": "skin11", "t": "Skin", "q": "What sun protection does the NHS recommend?", "o": ["At least SPF 30 and at least 4-star UVA protection", "SPF 15 is enough in the UK, as the sun isn't strong here", "SPF 30 for children, but adults only need SPF 15", "Any SPF with a UVB rating, as UVA rays don't burn"], "e": "Reapply regularly, especially after swimming. Keep babies under 6 months out of direct sun."}, {"id": "skin12", "u": 1, "t": "Skin", "q": "A customer has a painful, blistering rash in a band on one side of their body. What do you do?", "o": ["Refer to the pharmacist; it may be shingles and treatment works best early", "Sell calamine lotion and suggest they see the GP if the rash spreads", "Sell hydrocortisone cream, as it will calm the blisters and the pain", "Refer them to the GP if it's no better in two weeks, and sell painkillers"], "e": "Shingles antivirals are most effective started within 72 hours. Shingles near the eye needs urgent referral."}, {"id": "skin13", "u": 1, "t": "Skin", "q": "A child has crusty, golden-coloured sores around the mouth. What do you do?", "o": ["Refer to the pharmacist; it may be impetigo, which Pharmacy First covers", "Sell a cold sore cream, as crusty sores around the mouth are cold sores", "Sell hydrocortisone cream to calm it down, and suggest keeping it clean", "Suggest an antiseptic cream and let it heal, as it's just dry, cracked skin"], "e": "Impetigo is contagious. The pharmacist can assess it and give treatment if appropriate."}, {"id": "skin14", "t": "Skin", "q": "Who needs scabies treatment when one person in a household has scabies?", "o": ["Everyone in the household and close contacts, all on the same day", "Only the person with the rash, then others if they start itching", "Everyone with an itchy rash, each one as soon as their symptoms show", "The person with the rash first, then the rest of the household a week later"], "e": "Treat everyone at the same time, even without symptoms, and wash bedding and clothes. Itching can last a few weeks afterwards."}, {"id": "skin15", "t": "Skin", "q": "What is the best advice for nappy rash?", "o": ["Change nappies often, allow nappy-free time and use a barrier cream", "Dust with talc at each change to keep the skin dry, and use a barrier cream", "Use hydrocortisone cream at every change until the rash has cleared", "Use fragranced wipes at each change, and keep the nappy on to stop rubbing"], "e": "Refer if the rash is bright red with spots spreading out (possible thrush), the baby is unwell, or it isn't improving."}, {"id": "skin16", "t": "Skin", "q": "A customer says a mole has changed shape and sometimes bleeds. What do you do?", "o": ["Advise them to see their GP soon", "Suggest they watch it for 6 months", "Sell antiseptic cream for the bleeding", "Say moles often change and it's normal"], "e": "Changes in size, shape or colour, or itching or bleeding, can be signs of skin cancer."}, {"id": "skin17", "t": "Skin", "q": "What is the correct first aid for a minor burn?", "o": ["Cool it under cool running water for 20 minutes", "Hold an ice pack directly on it for 20 minutes", "Cool it under running water for 1 minute, then cover it", "Pop any blisters and cover it with a tight bandage"], "e": "Then cover it loosely with cling film or a clean dressing. Refer large, deep, facial or chemical burns, and burns on children."}, {"id": "skin18", "k": 1, "t": "Skin", "q": "A parent says their unwell child has a rash that doesn't fade when a glass is pressed on it. What do you do?", "o": ["Treat it as an emergency: call 999 or go to A&E now", "Refer to the pharmacist and sell an antihistamine meanwhile", "Sell calamine and suggest the GP if it's still there tomorrow", "Get an urgent GP appointment for later this week"], "e": "A rash that doesn't fade under a glass can be a sign of meningitis or sepsis."}, {"id": "skin19", "t": "Skin", "q": "Which shampoo ingredient is used for stubborn dandruff?", "o": ["Ketoconazole", "Hydrocortisone", "Permethrin", "Benzoyl peroxide"], "e": "Ketoconazole shampoo treats the yeast linked to dandruff and seborrhoeic dermatitis."}, {"id": "skin20", "t": "Skin", "q": "Where should OTC wart treatments NOT be used?", "o": ["On the face or genitals", "On the hands or the fingers", "On the soles of the feet", "On the knees or elbows"], "e": "Facial and genital warts need referral. Protect the surrounding skin when using acid treatments."}, {"id": "eem01", "t": "Eye, ear & mouth", "q": "A parent wants chloramphenicol eye drops for their 1-year-old's sticky eye. What do you do?", "o": ["Don't sell it; refer to the pharmacist", "Sell it and tell the pharmacist after", "Sell it, but use only one drop a day", "Sell it; drops are safe at any age"], "e": "Under-2s need to be seen. Also refer for eye pain, light sensitivity, blurred vision or contact lens wear."}, {"id": "eem02", "t": "Eye, ear & mouth", "q": "A customer wants ear wax drops but mentions ear pain and a discharge. What do you do?", "o": ["Don't sell the drops; refer to the pharmacist", "Sell olive oil drops, as they soften the wax", "Sell the drops and suggest painkillers too", "Sell the drops; discharge means the wax is softening"], "e": "Pain, discharge, hearing loss or a perforated eardrum mean referral. Never suggest cotton buds."}, {"id": "eem03", "k": 1, "t": "Eye, ear & mouth", "q": "A customer taking warfarin wants Daktarin oral gel (miconazole) for mouth thrush. What do you do?", "o": ["Refer to the pharmacist without selling the gel", "Sell it, as gels aren't absorbed into blood", "Sell it and tell them to check their INR soon", "Sell it but advise using it for three days only"], "e": "A classic serious interaction. Always ask about other medicines when selling miconazole oral gel."}, {"id": "eem04", "t": "Eye, ear & mouth", "q": "A parent wants Bonjela (choline salicylate) for their 10-month-old's teething. What do you say?", "o": ["It isn't suitable for under-16s; ask the pharmacist about baby-suitable options", "Sell it, but use only a pea-sized amount on the gums no more than twice a day", "It's fine from 4 months, so sell it and tell the pharmacist you've sold it", "Sell it, as gels rubbed on the gums aren't absorbed into the baby's bloodstream at all"], "e": "Choline salicylate is related to aspirin. Teething rings, baby teething products, or paracetamol or ibuprofen suspension at the right age are options."}, {"id": "eem05", "k": 1, "t": "Eye, ear & mouth", "q": "A contact lens wearer has a painful red eye. What do you do?", "o": ["Refer urgently via the pharmacist to an optometrist or eye service; stop wearing lenses", "Sell chloramphenicol drops, as red eyes in lens wearers are usually just bacterial conjunctivitis", "Refer to the GP next week; they can keep wearing lenses if comfortable", "Sell lubricating drops suitable for lenses and tell the pharmacist afterwards"], "e": "Contact lens wearers with a painful red eye can have a serious infection of the cornea."}, {"id": "eem06", "k": 1, "t": "Eye, ear & mouth", "q": "A customer has a red eye with pain, blurred vision and sensitivity to light. What do you do?", "o": ["Treat it as urgent: same-day eye assessment (optometrist, eye casualty or NHS 111)", "Sell chloramphenicol drops and advise seeing an optometrist if it's no better in 2 days", "Sell lubricating drops and advise booking a routine GP appointment", "Advise antihistamine eye drops, as light sensitivity is common with hay fever"], "e": "Pain, reduced vision or light sensitivity are red flags for serious eye conditions."}, {"id": "eem07", "t": "Eye, ear & mouth", "q": "How should chloramphenicol eye drops be stored once dispensed or sold?", "o": ["In the fridge", "In the freezer", "In a warm place", "By a sunny window"], "e": "Chloramphenicol drops are stored in a fridge. Eye ointment can be kept at room temperature. Check the pack."}, {"id": "eem08", "t": "Eye, ear & mouth", "q": "Does a child with conjunctivitis need to stay off school?", "o": ["No, they don't usually need to stay off", "Yes, until the eye is completely clear", "Yes, until they've had 2 days of drops", "Yes, for 48 hours after starting antibiotics"], "e": "UK health guidance doesn't exclude children for conjunctivitis. Advise hand washing and not sharing towels."}, {"id": "eem09", "t": "Eye, ear & mouth", "q": "What is usually recommended for dry, gritty eyes?", "o": ["Lubricating eye drops (e.g. hypromellose or carbomer)", "Chloramphenicol drops, to clear any infection causing it", "Antihistamine eye drops, as dryness is usually hay fever", "Decongestant eye drops to reduce the redness"], "e": "Refer if there's pain, reduced vision or it isn't improving."}, {"id": "eem10", "t": "Eye, ear & mouth", "q": "A customer has had a mouth ulcer for 4 weeks. What do you do?", "o": ["Refer to a GP or dentist", "Sell a stronger ulcer gel", "Refer if it lasts 6 weeks", "Suggest salt water rinses"], "e": "A long-lasting ulcer can be a sign of mouth cancer, especially in smokers and drinkers."}, {"id": "eem11", "u": 1, "t": "Eye, ear & mouth", "q": "Under Pharmacy First, which age group can the pharmacist assess for acute earache (otitis media)?", "o": ["Children and young people aged 1 to 17", "Adults aged 18 and over, but not children", "Children aged 6 months to 12 years", "Anyone aged 1 and over, including adults"], "e": "Pharmacy First covers acute otitis media in ages 1 to 17."}, {"id": "eem12", "t": "Eye, ear & mouth", "q": "What side effect can chlorhexidine mouthwash cause?", "o": ["Brown staining of the teeth, which can be removed", "Permanent yellowing of the teeth and fillings", "Bleeding gums for the first few days of use", "Drowsiness, so customers should avoid driving after using it"], "e": "Staining is reduced by brushing well. Chlorhexidine can also affect taste."}, {"id": "eem13", "t": "Eye, ear & mouth", "q": "What is the correct advice for ear wax?", "o": ["Olive oil or other wax drops a few times a day for 3–5 days; never use cotton buds", "Use cotton buds gently after a warm shower, when the wax is soft and easy to lift out", "Use ear candles once a week to draw the wax out, then olive oil drops for a day", "Use wax drops once a day for a month, then clear the ear with cotton buds"], "e": "Refer if there's pain, discharge, sudden hearing loss or a perforated eardrum."}, {"id": "eem14", "t": "Eye, ear & mouth", "q": "A denture wearer has oral thrush. What advice goes with treatment?", "o": ["Clean dentures well and take them out at night", "Keep dentures in at night so the gel works", "Wear dentures day and night to protect the gums", "Just rinse dentures; cleaning isn't needed"], "e": "Dentures can harbour thrush. Refer if it keeps coming back or the person has a weak immune system."}, {"id": "eem15", "t": "Eye, ear & mouth", "q": "Miconazole oral gel should not be used in babies under what age?", "o": ["4 months", "6 months", "12 months", "2 years"], "e": "There's a choking risk in young babies. Refer to the pharmacist."}, {"id": "eem16", "t": "Eye, ear & mouth", "q": "A customer's gums bleed when brushing. What is the right advice?", "o": ["Keep brushing gently twice a day, and see a dentist", "Stop brushing the sore areas until the bleeding settles", "Switch to a hard toothbrush to clear the plaque", "Use a strong mouthwash instead of brushing for a week"], "e": "Bleeding gums are usually gingivitis. Good brushing and a dental check help."}, {"id": "eem17", "t": "Eye, ear & mouth", "q": "What is the best advice for a stye?", "o": ["A warm compress several times a day; don't squeeze it", "Gently squeeze it to drain it, then use a warm compress", "Chloramphenicol drops straight away to stop it spreading", "A cold compress once a day; pop it once it comes to a head"], "e": "Most styes clear up on their own. Refer if it spreads, affects vision or doesn't improve."}, {"id": "eem18", "t": "Eye, ear & mouth", "q": "What is the main treatment for blepharitis (sore, crusty eyelids)?", "o": ["Daily eyelid hygiene with warm compresses and cleaning", "A week of chloramphenicol drops, then stop once it's clear", "Hydrocortisone cream rubbed thinly on the eyelids", "Lid cleaning only on days when the eyelids feel sore"], "e": "Blepharitis tends to keep coming back, so lid hygiene needs to continue."}, {"id": "eem19", "k": 1, "t": "Eye, ear & mouth", "q": "A customer suddenly lost hearing in one ear this morning. What do you do?", "o": ["Advise urgent assessment today (NHS 111 or A&E)", "Sell wax drops; refer if no better in a week", "Suggest a decongestant, as it's likely a cold", "Advise a routine GP appointment next month"], "e": "Sudden hearing loss needs urgent assessment, as early treatment can help."}, {"id": "eem20", "t": "Eye, ear & mouth", "q": "A customer on several regular medicines complains of a dry mouth. What do you do?", "o": ["Involve the pharmacist; sugar-free gum or saliva products can help", "Suggest boiled sweets to keep the saliva flowing during the day", "Suggest they stop their medicines for a few days to see if it helps", "Sell an alcohol mouthwash and tell the pharmacist afterwards"], "e": "Many medicines cause dry mouth. Never advise stopping a prescribed medicine."}, {"id": "wom01", "t": "Women's & sexual health", "q": "A 35-year-old wants fluconazole for thrush. Which answer means you should refer her?", "o": ["This is her third episode in 6 months", "She had thrush once, about a year ago", "She has itching and a white discharge", "She used a cream last time instead"], "e": "Refer for more than 2 episodes in 6 months, under 16 or over 60, pregnancy, unusual discharge, sores, or abdominal pain."}, {"id": "wom02", "t": "Women's & sexual health", "q": "A man asks for cystitis treatment for himself. What do you do?", "o": ["Refer him to be assessed", "Sell a cystitis sachet", "Try cranberry juice first", "Sell it; tell the pharmacist"], "e": "Refer men, children and pregnant women with urinary symptoms, and anyone with blood in the urine, fever or back pain."}, {"id": "wom03", "t": "Women's & sexual health", "q": "A man wants to buy the morning-after pill for his girlfriend. What do you do?", "o": ["Explain kindly that the pharmacist needs to speak with her directly, as soon as possible", "Sell it to him, as long as he confirms she has no medical problems", "Tell them both to see her GP next week, as pharmacies can't supply it to a man", "Ask the pharmacist to sell him two packs, so that she has a spare for next time"], "e": "Emergency contraception needs a consultation with the person taking it. Be discreet and non-judgemental."}, {"id": "wom04", "t": "Women's & sexual health", "q": "Levonorgestrel emergency contraception can be taken up to how long after unprotected sex?", "o": ["72 hours (3 days); the sooner, the better", "5 days (120 hours); the sooner, the better", "24 hours; after that it won't work", "Any time before the next period is due"], "e": "Pass the customer to the pharmacist straight away. An IUD or ulipristal may be options later."}, {"id": "wom05", "t": "Women's & sexual health", "q": "Ulipristal (ellaOne) emergency contraception can be taken up to how long after unprotected sex?", "o": ["120 hours (5 days)", "72 hours (3 days)", "24 hours (1 day)", "10 days (240 hours)"], "e": "It is still more effective the sooner it's taken. The pharmacist makes the supply."}, {"id": "wom06", "t": "Women's & sexual health", "q": "A pregnant woman wants fluconazole capsules for thrush. What do you do?", "o": ["Refer her to the pharmacist", "Sell it at half the dose", "Sell it; one dose is fine", "Sell it, then tell the pharmacist"], "e": "Thrush in pregnancy needs advice from the pharmacist, GP or midwife."}, {"id": "wom07", "u": 1, "t": "Women's & sexual health", "q": "Under Pharmacy First, who can the pharmacist assess for an uncomplicated urinary tract infection?", "o": ["Women aged 16 to 64", "Anyone aged 16 to 64", "Women aged 18 to 75", "Women aged 18 and over"], "e": "Pharmacy First covers uncomplicated UTI in women aged 16–64. Others need referral."}, {"id": "wom08", "t": "Women's & sexual health", "q": "A woman with cystitis symptoms also has a high temperature and pain in her back. What do you do?", "o": ["Refer her to the pharmacist urgently", "Sell sachets and paracetamol", "Suggest more water and wait 2 days", "Sell ibuprofen and send her home"], "e": "Fever, back or loin pain, vomiting or blood in the urine need urgent assessment."}, {"id": "wom09", "t": "Women's & sexual health", "q": "A customer takes blood pressure tablets and wants potassium citrate cystitis sachets. What do you do?", "o": ["Check with the pharmacist before selling", "Sell them, as they're only a mild remedy", "Suggest pausing the tablets while using them", "Sell them; potassium is just a mineral"], "e": "Potassium citrate isn't suitable with some medicines (e.g. ACE inhibitors or potassium-sparing diuretics) or with kidney problems."}, {"id": "wom10", "u": 1, "t": "Women's & sexual health", "q": "Can a progestogen-only contraceptive pill (desogestrel) be bought without a prescription in the UK?", "o": ["Yes, as a P medicine, after a consultation with the pharmacist", "Yes, as a GSL medicine, from any pharmacy or supermarket shelf", "No, it's only available on prescription from a GP or sexual health clinic", "Yes, but only by women who already have it on prescription"], "e": "Since 2021, desogestrel pills (e.g. Hana, Lovima) have been available from pharmacies after a pharmacist consultation."}, {"id": "wom11", "k": 1, "t": "Women's & sexual health", "q": "A man wants Viagra Connect (sildenafil) and mentions he uses a GTN spray for angina. What do you do?", "o": ["Refer him to the pharmacist, without selling it", "Sell it, as the GTN spray is only used now and then", "Sell it, but tell him not to use the spray that day", "Sell it and let the pharmacist know afterwards"], "e": "Sildenafil must never be taken with nitrates. OTC sildenafil is for men 18+ after a pharmacist consultation."}, {"id": "wom12", "k": 1, "t": "Women's & sexual health", "q": "A 60-year-old woman whose periods stopped years ago mentions some vaginal bleeding. What do you do?", "o": ["Advise her to see her GP soon", "Reassure her; this is normal at 60", "Sell her a thrush treatment", "Sell sanitary towels only"], "e": "Bleeding after the menopause is a red flag."}, {"id": "wom13", "u": 1, "t": "Women's & sexual health", "q": "Who can buy Gina (estradiol vaginal tablets) from a pharmacy for vaginal dryness?", "o": ["Women aged 50+ who haven't had a period for at least a year, after a pharmacist consultation", "Women aged 45+ who still have irregular periods, after a pharmacist consultation", "Any woman over 18 with vaginal dryness, sold straight from the shelf without any questions", "Women aged 50+ with dryness, but only with a GP prescription or a GP letter"], "e": "Gina became a P medicine in 2022 for menopause-related vaginal atrophy."}, {"id": "wom14", "t": "Women's & sexual health", "q": "From when can most pregnancy tests be used?", "o": ["From the first day of a missed period (some earlier, as the pack says)", "From the day after unprotected sex, as long as you test with first morning urine", "From 3 months into pregnancy, when hormone levels are high enough", "At any time, as all tests are accurate from the day of conception"], "e": "Testing too early can give a false negative. Follow the instructions."}, {"id": "wom15", "t": "Women's & sexual health", "q": "What is the recommended folic acid dose for a woman trying for a baby?", "o": ["400 micrograms daily, before conception until 12 weeks of pregnancy", "5mg daily for everyone, from conception until the baby is born", "400 micrograms daily, starting from the first scan at 12 weeks", "400 micrograms weekly, before conception until 12 weeks of pregnancy"], "e": "Some women need a higher dose on prescription, e.g. those with diabetes or epilepsy. Refer if unsure."}, {"id": "wom16", "t": "Women's & sexual health", "q": "A 15-year-old asks for emergency contraception. What do you do?", "o": ["Treat it confidentially and pass her to the pharmacist, who can assess her", "Refuse politely, as she's under 16, and suggest the GP next week", "Pass her to the pharmacist, after phoning her parents for consent", "Check her age with photo ID first, then refer her on to a sexual health clinic instead"], "e": "Under-16s can be supplied after the pharmacist's assessment. Confidentiality matters, and safeguarding is the pharmacist's job."}, {"id": "wom17", "t": "Women's & sexual health", "q": "A customer is worried they might have a sexually transmitted infection. What do you do?", "o": ["Signpost to a sexual health clinic or free NHS testing, discreetly", "Sell a thrush treatment, as symptoms are often similar", "Reassure them it will clear up on its own within a month, and to come back if not", "Sell an antiseptic wash and see if it settles in a week"], "e": "Sexual health services are free and confidential. Many offer home testing kits."}, {"id": "wom18", "t": "Women's & sexual health", "q": "A breastfeeding mother wants a hay fever tablet. What do you do?", "o": ["Check with the pharmacist before selling anything", "Sell any brand; hay fever tablets don't reach breast milk", "Explain she can't take any medicine while breastfeeding", "Sell a drowsy antihistamine, as it'll help her sleep too"], "e": "Some medicines pass into breast milk. The pharmacist will choose a suitable option."}, {"id": "wom19", "t": "Women's & sexual health", "q": "A breastfeeding mother has a hot, red, painful area on her breast and feels flu-like. What do you do?", "o": ["Refer her to the pharmacist, as she may need a GP", "Sell a cold remedy, as it sounds like flu", "Advise her to stop breastfeeding until it settles", "Sell nipple cream and refer if no better in 2 weeks"], "e": "Mastitis with fever or lasting symptoms needs assessment. She should usually keep feeding."}, {"id": "wom20", "t": "Women's & sexual health", "q": "A customer on warfarin wants cranberry capsules for cystitis. What do you do?", "o": ["Check with the pharmacist first", "Sell them, as they're natural", "Sell them; tell the pharmacist later", "Suggest pausing warfarin for a day"], "e": "\"Natural\" doesn't mean safe. Always ask about other medicines, including for herbal and supplement sales."}, {"id": "kid01", "k": 1, "t": "Babies & children", "q": "A parent says their 2-month-old has a temperature of 38.5°C. What do you do?", "o": ["Advise urgent medical help now (GP same day, NHS 111, or 999 if very unwell)", "Sell infant paracetamol and refer to the GP if it lasts more than 48 hours", "Give infant ibuprofen, then check with the pharmacist if no better tomorrow", "Suggest a lukewarm bath and fluids, and book a GP appointment this week"], "e": "Under 3 months, a temperature of 38°C or more needs urgent assessment."}, {"id": "kid02", "k": 1, "t": "Babies & children", "q": "A grandparent phones to say a toddler has swallowed some of their tablets. What do you advise?", "o": ["Call 999 or go to A&E now, and take the medicine packet", "Make the child sick with salt water, then call the GP", "Wait an hour, and call 111 if any symptoms develop", "Give milk to line the stomach, and ask the pharmacist later"], "e": "Suspected poisoning in a child is an emergency. Never make them vomit."}, {"id": "kid03", "t": "Babies & children", "q": "From what age can infant ibuprofen suspension usually be given?", "o": ["3 months (and weighing over 5kg)", "2 months (after the first vaccinations)", "6 months (and weighing over 7kg)", "From birth, if weighing over 3kg"], "e": "Infant paracetamol can be given from 2 months (after vaccinations). Ibuprofen from 3 months and over 5kg."}, {"id": "kid04", "t": "Babies & children", "q": "How should a children's liquid medicine be measured?", "o": ["With the oral syringe or spoon supplied, using the dose for the child's age on the pack", "With a level kitchen teaspoon, as one teaspoon always holds exactly 5ml", "With the syringe supplied, using the adult dose split in half for childr
